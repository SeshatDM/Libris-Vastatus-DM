<script>window.SITE={"tier": "dm", "page": "pois", "items": [{"name": "Scafield", "region": "I — The Sunder Basin", "type": "settlement", "era": "Living", "terrain": "tent-and-plank boomtown on the lip of a fresh crater, red dust over everything", "holder": "House Newcome", "now": "Two months old and doubling by the week. A fresh fall drew the prospectors, and the town bloomed around the crater like mold on bread — dram-hunters, Redhand card tables, a Newcome claim-office that is quietly the only law. Water's dear, tempers short, and everyone's one strike from rich or dead.", "threads": ["Two outfits are a hard word away from shooting over a claim line nobody surveyed.", "A Newcome factor is hiring guns for a 'special haul' leaving at night, no questions.", "A prospector found something in the crater he won't log and won't sell."], "connections": ["House Newcome", "The Sands of Devouring"], "arcSeam": null, "legendary": null}, {"name": "The Exalted City of Wahyrst", "region": "I — The Sunder Basin", "type": "settlement", "era": "Living (on old-world bones)", "terrain": "a walled stone city on a mesa spur, lit wall against the dark, the only true city for a hundred miles", "holder": "House Newcome (seat) — House Radiant keeps a mission within the walls", "now": "The capital of the western frontier: where a crater-rich Newcome fortune bought respectability and a lit wall. Caravans terminate here, dram is bought and sold on the open market, and the desperate come for the one wall that holds. Beneath the new stone are older foundations no one discusses.", "threads": ["A Newcome lordling wants quiet work done on a rival the law can't touch.", "The wall's light guttered for a night last month and the city won't say why.", "A Radiant preacher is drawing crowds — and converts who then disappear into the mission."], "connections": ["House Newcome", "House Radiant"], "arcSeam": "Wahyrst's wall runs on dram like every wall does — a hidden blood-house under the old foundations, fed in the main on dumb beast-stock. But its brightest workings need better than that, and since the scaled folk went extinct the only renewable premium left is human blood. Radiant supplies it the one way a church can: devout converts who 'give themselves wholly to the Light' and are never seen again. The night the wall guttered, that premium supply had run short. A low-floor rung of the reveal ladder — the first place a curious party might ask the wrong question twice, and the first hint that the miracles eat people, not only beasts. (See the fuel ladder: scaled = extinct peak, humans = renewable premium, dinosaurs = industrial base.)", "legendary": null}, {"name": "The Bastion of the Vampire Empress", "region": "I — The Sunder Basin", "type": "stronghold (ruin)", "era": "Old-world", "terrain": "a red-rock mesa throne over the salt flats, half-sunk, silent", "holder": "nominally unclaimed — Newcome prospectors won't dig the mesa and won't say why", "now": "The first throne of an immortal who ruled before the Tearfall. Daylight shows an empty ruin. It is not empty. The nearest boomtown warns its children off the mesa, and the old Treaty-kept give it a wide, deliberate ride.", "threads": ["A Newcome survey crew went up to assess the stone and came back wrong — quiet, cold, and fewer.", "A Redhand fence three towns over is selling 'relics' from the Bastion that are far too genuine.", "Speak to the ruin at dusk and, some swear, it answers."], "connections": ["The Vampire Empress", "The ruins of Castle Ravenloft (West)", "Eternal Night"], "arcSeam": "This is Tatyana's first throne. Taken by Strahd, left without a savior when the Founding Families killed Kas, she was made and sealed — the Vampire Empress, undying, no escape. She remembers the whole lineage and has warred on the Houses for ~300 years and lost every time. She has the truth and no vessel to carry it. WAY late, and only once the party is a real piece, she may make a cold offer: be the blade she can't be. Never a friend, never early, never free.", "legendary": "Pale King sign in the flats below the mesa."}, {"name": "The Sands of Devouring", "region": "I — The Sunder Basin", "type": "natural feature", "era": "Natural", "terrain": "a white salt-desert that swallows the careless; heat-shimmer, no landmarks, buried things", "holder": "unclaimed", "now": "The killing waste between the western towns. Noon turns the air to glass and the sand to a furnace; the bones of those who tried to cross in daylight dot the flats. The Treaty-kept know the night-paths that keep a traveler alive, and sell that knowledge dear.", "threads": ["A lost caravan's cargo is still out there, and someone has a map that's only half a lie.", "A Treaty-kept guide will take you across — for a price, and on their terms.", "Tracks cross the open sand and simply stop, as if the walker was lifted away."], "connections": ["The Pale King", "The Vale of Dens"], "arcSeam": null, "legendary": "The Pale King — meet it only in dead-noon heat, cloudless sky, open salt, with a kill or live bait to draw it from the shimmer. DM: its blood runs clear as water and mends like nothing alive — the most valuable animal in the world to anyone who knows what blood is really for. It always returns; the flats keep their king."}, {"name": "The Desolation of Nabalsha", "region": "I — The Sunder Basin", "type": "natural feature (blighted)", "era": "Contested", "terrain": "a dead salt-flat where nothing roots; no water, no game, a wrongness to the air", "holder": "shunned / unclaimed", "now": "A patch of dead ground the maps mark and travelers skirt. The old-timers say it was green once. It is wider now than it was a generation ago, and the edge keeps creeping into land people are still trying to farm.", "threads": ["A homesteader's acreage is going dead at the edges and he wants to know why — or wants it stopped.", "An Asher band is camped at the rim, watching the dead ground like sentries.", "A Press mapmaker is charting the blight's growth and asking questions that make people nervous."], "connections": ["The Ashers", "The Press"], "arcSeam": "Every Desolation is a defiling scar — ground a blood-house worked hard, or works still, hidden nearby. The dead flat is the atrocity made visible, spreading. The Ashers know what the scar means; the Press is trying to prove it; and ground like this is exactly where the Bone Shepherd walks. Mid rung of the reveal ladder for a party that follows the dead land to its source.", "legendary": null}, {"name": "The Labyrinth of the Wraith Count", "region": "I — The Sunder Basin", "type": "dungeon", "era": "Old-world", "terrain": "a sunken maze of old-world stone in the broken western hills", "holder": "the dead", "now": "A pre-Tearfall lord's buried seat — a maze so cruel it killed its own builders, and the wraiths of the old age still walk it. Treasure-hunters go down for the old-world silver and the relics. Few come back, and the ones who do don't sleep right.", "threads": ["A Redhand crew is a body short and needs a fourth who can read old-script to get past the first doors.", "A relic rumored in the deep is said to 'remember the old magic' — which would make it priceless, or cursed.", "A lone survivor raves in a Wahyrst flophouse about a door that should not open, and did."], "connections": ["Old-world ruins"], "arcSeam": "The Wraith Count was a minor pre-Tearfall noble, no more. But a deep enough vault here could hold an old-world record — a fragment of how the world was before the Vanishing — buried under the maze's death. A hard, optional thread for a party chasing the truth down into the bones.", "legendary": null}, {"name": "Mebury, the City of Bridges", "region": "I — The Sunder Basin", "type": "settlement", "era": "Living (on old-world bones)", "terrain": "a crossing-town built across a tangle of impossible ancient bridges spanning a deep chasm", "holder": "free folk hold it — House Meridian wants it", "now": "A thriving, half-lawless crossing-town that lives on the old world's bridges — spans no one alive knows how to build or truly repair. Everything moving east or west through the Sunder Basin passes over Mebury's roads, which makes it rich, and watched. Meridian surveyors have started measuring the spans.", "threads": ["Meridian is offering to 'modernize' the bridges — which the free folk read, correctly, as a taking.", "A main span has gone unstable and nobody knows the old method to shore it up.", "A Redhand route runs underneath the bridges, through the chasm, past every toll and eye."], "connections": ["Naledzadd, the City of Bridges (East)", "House Meridian"], "arcSeam": null, "legendary": null}, {"name": "The Vale of Dens", "region": "I — The Sunder Basin", "type": "settlement (homeland)", "era": "older than the Houses", "terrain": "a sheltered green vale of dens and old growth, hidden in the dry southwest hills", "holder": "the Treaty-kept", "now": "One of the oldest continuously-held grounds in the west — a Treaty-kept holding where people and beasts have lived in the old reciprocity since before any House lit a wall. Outsiders enter on sufferance, and leave when they're told. Water here, and quiet, and eyes on every ridge.", "threads": ["A Newcome claim has been filed on the vale's edge, and the paper says the land is empty.", "An elder will test a stranger's character the slow way before telling them anything true.", "A bonded beast here gives blood that 'remembers' — a first, quiet thread toward the difference between given and taken."], "connections": ["The Treaty-kept", "The Sands of Devouring"], "arcSeam": "The Treaty-kept keep the freely-given way as sacred reciprocity and distrust the Houses' bought miracles on instinct — they have never forgotten what the newcomers' grandfathers did, even if they no longer say it aloud. An elder here is one of the few who could, much later and only if the party earns it, begin to name what the scaled folk really were.", "legendary": null}, {"name": "Trafeld", "region": "I — The Sunder Basin", "type": "settlement", "era": "Living", "terrain": "a tired waystation town on the last water before the deep desert", "holder": "House Newcome (loosely) — mostly free folk", "now": "The last stop between Wahyrst and the Sands of Devouring. Everyone crossing west fills their barrels here, and Trafeld makes its living on that thirst — overpriced water, cheap whiskey, and guides who may or may not get you to the other side.", "threads": ["A guide for hire has lost three parties in the Sands — bad luck, or is he feeding something?", "A caravan that should've reached the crossing days ago hasn't.", "There's a Redhand cache under the livery that the owner swears he knows nothing about."], "connections": ["The Sands of Devouring", "The Exalted City of Wahyrst"], "arcSeam": null, "legendary": "On the desert's edge — travelers bring in Pale King sign (bleached kills, tracks that stop) more often than anywhere else. See The Sands of Devouring."}, {"name": "Moonstone Downs", "region": "I — The Sunder Basin", "type": "settlement", "era": "Living", "terrain": "pale rolling downs under the western peaks, thin grass and old barrows", "holder": "free folk — scattered herders", "now": "High herding country where a brief moonstone rush came and went, leaving a few stubborn families running saurian flocks across the downs. Quiet, poor, and far from any wall.", "threads": ["A played-out moonstone claim that someone insists is still worth killing over.", "Stock is going missing at night, and it isn't wolves.", "The old barrows in the downs are pre-Tearfall — and one's been dug open from the inside."], "connections": [], "arcSeam": null, "legendary": null}, {"name": "Spiderweb Vale", "region": "I — The Sunder Basin", "type": "natural feature", "era": "Natural", "terrain": "a narrow vale strung corner to corner with the webs of something large", "holder": "unclaimed (shunned)", "now": "A shortcut that would save a week of hard riding, if the webs weren't the work of things no one's seen whole. Most go the long way. The desperate don't.", "threads": ["A trapper harvests the silk and sells it dear — and knows the safe hours.", "A wagon was found cocooned, team and all, cargo untouched.", "The webs are spreading past the vale mouth this year."], "connections": [], "arcSeam": null, "legendary": null}, {"name": "Rotted Wood", "region": "I — The Sunder Basin", "type": "natural feature", "era": "Natural", "terrain": "a forest that died standing — grey trunks still upright, never fallen", "holder": "unclaimed (avoided)", "now": "Good timber by the mile that no one will touch, because the trees didn't burn or blow down — they simply died where they stood, upright and grey, and the quiet in there is wrong.", "threads": ["Something dens in the dead wood and comes out hungry.", "A timber baron will pay well for anyone who'll fell it; nobody has twice.", "The dead stand spreads a little further from the Bastion's direction each year."], "connections": ["The Bastion of the Vampire Empress"], "arcSeam": null, "legendary": null}, {"name": "Deadmoor River", "region": "I — The Sunder Basin", "type": "natural feature", "era": "Natural", "terrain": "a sluggish alkaline river that poisons more than it waters", "holder": "contested", "now": "Named for the stock it's killed. The water looks fine and kills slow, and the one clean spring that feeds a safe stretch is worth more than gold to the ranches strung along it.", "threads": ["A rancher upstream is diverting the clean spring and daring anyone to stop him.", "Bodies float down now and then from somewhere further up.", "A Newcome survey says there's dram-grade something in the riverbed mud."], "connections": [], "arcSeam": null, "legendary": null}, {"name": "Hayra Waste", "region": "I — The Sunder Basin", "type": "natural feature", "era": "Natural", "terrain": "a broken badland of wind-carved rock and blind washes", "holder": "outlaws", "now": "Bandit country — a maze of stone where posses lose their quarry and their nerve. The outfits that hole up here know every wash; the marshals don't come in after them.", "threads": ["A wanted outfit is dug in with a hostage and a grievance.", "A dry wash just gave up something old and metal after a flash flood.", "A guide offers a through-route the law has never mapped."], "connections": [], "arcSeam": null, "legendary": null}, {"name": "Maford Tower", "region": "I — The Sunder Basin", "type": "stronghold (ruin)", "era": "Old-world", "terrain": "a lone pre-Tearfall watchtower on a rise, still whole, still watching nothing", "holder": "unclaimed — a hermit squats the top", "now": "One of the old Maford line's watchtowers, standing centuries after the house that raised it fell. A hermit lives in the top and won't come down; a light shows in the high window some nights that the hermit swears isn't his.", "threads": ["Newcome wants the tower for a heliograph relay and the hermit in a shallow grave.", "The hermit will trade what he knows of the old house for something he badly needs.", "The cellar is older than the tower and sealed from the wrong side."], "connections": ["The Garden City of Maford", "Maford Castle"], "arcSeam": "The Maford line was a pre-Tearfall house with seats across the old world (the Garden City, the Castle, this tower). Minor on the surface — but an old house's deep cellar is the kind of place a fragment of the before-time could still sit, unread. Low rung, optional.", "legendary": null}, {"name": "Nidly Woods", "region": "I — The Sunder Basin", "type": "natural feature", "era": "Natural", "terrain": "a thin scrub-wood, the last green before the deep west", "holder": "free folk (charcoal-burners)", "now": "A ragged belt of scrub where charcoal-burners work the slow kilns that feed the western forges. Not much to it — unless you're the kind who notices the trails don't match any map.", "threads": ["The charcoal-burners are hiding something in the smoke — a still, a body, or a person.", "A saurian nest in the thickets is getting bold.", "A trail leads somewhere that isn't on any chart and doubles back wrong."], "connections": [], "arcSeam": null, "legendary": null}, {"name": "Anirh Vale", "region": "I — The Sunder Basin", "type": "settlement", "era": "Living", "terrain": "a watered farming vale, rare green in a dry country", "holder": "free folk — founding farm families", "now": "One of the few vales that actually feeds the west, worked by families who were here before the boom and intend to outlast it. Which makes the land valuable, and the families nervous.", "threads": ["House Sabine wants the grazing and is making offers that sound like threats.", "A blight is creeping into the crops from the dry edge of the vale.", "Two founding families are a shooting away from a feud over a water right."], "connections": [], "arcSeam": null, "legendary": null}, {"name": "Foxwood Forest", "region": "I — The Sunder Basin", "type": "natural feature", "era": "Natural", "terrain": "a true forest — the west's main timber and hunting ground", "holder": "contested — Meridian needs timber for ties; free folk resist", "now": "The green heart of the dry west, where the frontier gets its timber, its game, and its tall tales. Big enough to get lost in, old enough to have its own rules.", "threads": ["A pale stag-saurian the hunters call a king-beast is rumored in the deep wood.", "Poachers and a lone warden are headed for blood.", "The game is fleeing the forest's center, and no one will say what from."], "connections": [], "arcSeam": null, "legendary": null}, {"name": "Janeh", "region": "I — The Sunder Basin", "type": "settlement", "era": "Living", "terrain": "a modest older town, settled long before the boom", "holder": "free folk — town council", "now": "The respectable west: a town that was here before the craters and is grimly proud it never became a boomtown. Orderly, churchy, and quietly in over its head.", "threads": ["The council owes Merrow more than it can pay and is hiding it.", "A nearby boomtown's overflow is about to swamp Janeh's quiet streets.", "The marshal here still believes the badge means something — and is about to be tested on it."], "connections": [], "arcSeam": null, "legendary": null}, {"name": "The Keep of Fiery Ruin", "region": "I — The Sunder Basin", "type": "stronghold (ruin)", "era": "Old-world", "terrain": "a burned old-world keep, scorched stone fused black, never rebuilt", "holder": "the dead", "now": "One of a pair — the Keep and the Abbey — that burned in the same old fire and were never raised again. The lord's name is struck from every record that survived, as if someone wanted him forgotten as much as dead.", "threads": ["Treasure-hunters go in for the old-world steel and come out burned or not at all.", "Locals swear the stone glows faintly on the fire's anniversary.", "Why the lord's name was erased is a question some people will pay to keep unasked."], "connections": ["The Abbey of Fiery Ruin"], "arcSeam": "The twin burnings — a lord's keep and a faith's abbey, same fire, same erasure — are an old-world wound no tale explains. A DM can leave it a mystery, or make it an early-defiling catastrophe: the fire that answers what happens when the taking goes wrong at scale. Optional, low.", "legendary": null}, {"name": "The Abbey of Fiery Ruin", "region": "I — The Sunder Basin", "type": "ruin", "era": "Old-world", "terrain": "a gutted old-world abbey, its faithful dead in the same fire as the Keep", "holder": "the dead — pilgrims still come", "now": "The abbey burned the night the Keep did. A few pilgrims of a forgotten faith still walk the black cloisters, and they say the crypt beneath never caught — that something down there was kept whole on purpose.", "threads": ["A relic is rumored unburnt in the untouched crypt.", "The pilgrims' faith predates anything Radiant preaches, and Radiant wants it stamped out.", "One pilgrim knows the real reason the abbey and keep died together."], "connections": ["The Keep of Fiery Ruin", "The Shrine of Broken Worlds"], "arcSeam": "The abbey's forgotten faith may be an older, truer thing than Radiant — possibly a Broken Worlds root. What the crypt kept whole through the fire is a thread for a party that digs; whether it's relic, record, or witness is the DM's call.", "legendary": null}, {"name": "Cubrook", "region": "I — The Sunder Basin", "type": "settlement", "era": "Living", "terrain": "a poor crossroads hamlet at the edge of the Sea of Thile", "holder": "free folk — fishers and salt-rakers", "now": "A handful of weathered families raking salt and pulling fish from the inland sea, at the ragged southwest end of everything. The water's been rising for years, and Cubrook is losing a little more ground each season.", "threads": ["Smugglers land cargo on the salt flats by night and pay the hamlet to see nothing.", "Something came out of the sea and took a boat whole.", "The oldest house in the hamlet will be underwater by spring, and the family won't leave."], "connections": ["Lecot", "The Sea of Thile"], "arcSeam": null, "legendary": null}, {"name": "Armawr Woods", "region": "I — The Sunder Basin", "type": "natural feature", "era": "Natural", "terrain": "dense old southern woods, dark and quiet", "holder": "Treaty-kept paths run through it", "now": "Old forest the Treaty-kept have walked since before the newcomers, laced with trails outsiders can't read. Locals leave offerings at certain trees and don't explain why.", "threads": ["A lumber camp at the eaves has gone silent.", "A Treaty-kept guide will lead you true — if you've shown you're worth leading.", "Whatever the offerings are for, someone stopped leaving them, and the woods noticed."], "connections": ["The Vale of Dens"], "arcSeam": null, "legendary": null}, {"name": "Werewood Forest", "region": "I — The Sunder Basin", "type": "natural feature", "era": "Natural", "terrain": "a forest with a shapeshifter's name — the were-wood", "holder": "unclaimed (feared)", "now": "A wood where, the stories go, things aren't the beasts they look like — a deer that watches too long, a hound that walks a half-step wrong. People who camp here come out changed, or don't come out.", "threads": ["A hunter swears a deer spoke to him, and he hasn't been right since.", "Travelers who crossed the wood came out subtly, wrongly different.", "Something in the wood is learning to pass for the people who enter it."], "connections": [], "arcSeam": "The 'things that aren't what they look like' is folk-memory of the blenders — the thinking stock that passes for dumb until it's too late. A deniable, early, ground-level brush with the truth that some beasts are people, long before anyone names the Kinline.", "legendary": null}, {"name": "Bargel Woods", "region": "I — The Sunder Basin", "type": "natural feature", "era": "Contested", "terrain": "southern timber woods, now scarred by fresh cutting", "holder": "contested — free folk hold it; Meridian needs the tie-timber", "now": "Good rail-tie timber, which is exactly the problem — Meridian holds a cutting contract the locals never agreed to, and the woods are coming down faster than anyone can argue about it.", "threads": ["A Meridian cutting crew and the locals are headed for open conflict.", "A hermit cartographer in the woods has mapped something Meridian would pay to bury.", "Something big denned in the uncut heart, and the cutting is driving it out."], "connections": ["House Meridian"], "arcSeam": null, "legendary": null}, {"name": "The Holy City of Baleah", "region": "I — The Sunder Basin", "type": "settlement", "era": "Living (on old-world bones)", "terrain": "a walled, lit cathedral-city, green within its walls, pilgrims at every gate", "holder": "House Radiant (western seat)", "now": "Radiant's seat in the west — a cathedral-city where the sick come to be healed and the lost to be sheltered, behind the brightest wall for two hundred miles. The faithful want for nothing. The faith wants everything.", "threads": ["Pilgrims are arriving faster than the city can hold, and the overflow is desperate.", "A new miracle is drawing enormous crowds — and the usual quiet trickle of 'ascended' converts who are never seen again.", "Two preachers are tearing the city toward schism over what the Light truly asks."], "connections": ["House Radiant", "The Exalted City of Wahyrst"], "arcSeam": "Baleah is Wahyrst's seam at full scale: a blood-house beneath the cathedral, and the holiest, brightest workings fed on the premium human tier — devout converts who 'give themselves wholly to the Light' and ascend into the drains. A higher rung than Wahyrst, where the faith isn't a cover for the harvest, it IS the harvest.", "legendary": null}, {"name": "The Citadel of Ocus the Deranged", "region": "I — The Sunder Basin", "type": "dungeon", "era": "Old-world", "terrain": "a mad pre-Tearfall lord's citadel, built to no sane plan", "holder": "the dead (and Ocus's works)", "now": "The seat of a lord the old world called mad, raised to a design that hurts to look at and riddled with the things he made. A deathtrap with a theme, and the theme is one ruined mind.", "threads": ["A relic of Ocus's 'great work' is rumored intact in the heart of the citadel.", "The few who've come out came out raving the same three words.", "A Redhand crew is recruiting a fourth who can survive a mad lord's logic."], "connections": ["The Labyrinth of the Wraith Count"], "arcSeam": "Ocus's 'great work' is an optional deep lever: a minor old-world lord who dabbled in the taking before Kas made it a trade — an early, crude, failed experiment in blood-power that drove him mad. A party that reads his citadel aright finds the atrocity's prehistory.", "legendary": null}, {"name": "Lecot", "region": "I — The Sunder Basin", "type": "settlement", "era": "Living", "terrain": "a fishing-and-trade town on the shore of the inland Sea of Thile", "holder": "free folk — with Merrow money on the docks", "now": "The Basin's door to the southern water: a working port where saurian-whalers land, traders move goods north, and Merrow quietly owns more of the wharves than anyone admits. The gateway south, and south of here the map gets strange.", "threads": ["A whaling crew has a grudge against a Merrow factor and a hold full of leverage.", "Contraband dram moves through Lecot's docks under honest cargo.", "A ship came in crewed by no one, and the harbor master wants it gone quietly."], "connections": ["Cubrook", "The Sea of Thile"], "arcSeam": null, "legendary": null}, {"name": "Baugate", "region": "II — The Redgrass", "type": "settlement", "era": "Living", "terrain": "a rail-and-cattle town where the plains meet the market", "holder": "House Sabine (with a Meridian depot)", "now": "The first real town coming off the open range — pens, stockyards, a Meridian depot, and the smell of a hundred thousand head. Sabine grew fat here on the drive and the rail, and Sabine's word is the law that matters.", "threads": ["A rustling ring is hitting the big studbook sires — stealing the future, not the beef.", "A Sabine–Meridian spat over depot fees is about to stop being about fees.", "A drover saw something in the far pens he was never meant to, and he's drinking to forget it."], "connections": ["House Sabine", "House Meridian"], "arcSeam": null, "legendary": null}, {"name": "Tenby", "region": "II — The Redgrass", "type": "settlement", "era": "Living", "terrain": "a dusty waystation on the long cattle road", "holder": "free folk, under Sabine's shadow", "now": "Half the year it feeds the drovers coming up the drive road; the other half it's nearly a ghost town. Sabine doesn't own Tenby outright, but Sabine's displeasure still closes every door in it.", "threads": ["A drive boss is hiring guns against 'rustlers' who are really the Given.", "A Sabine regulator is in town and no one knows whose name is on his list.", "A passing preacher is asking the kind of questions that get a man followed."], "connections": ["House Sabine", "The Given"], "arcSeam": null, "legendary": null}, {"name": "Plebury, the City of Omens", "region": "II — The Redgrass", "type": "settlement", "era": "Living", "terrain": "a plains city of augurs, card-readers, and sky-watchers", "holder": "free / mixed — the reader-guilds hold real power", "now": "The Redgrass's strange heart, where people come to have the future read in cards, in bones, in the fall of the sky. Half the readers are frauds. The other half are worse, because they're right.", "threads": ["A true reader has gone missing after a prophecy about the Houses.", "Rival reader-guilds are feuding over a client worth killing for.", "Someone wants a specific omen read — or un-read — and will pay in dram."], "connections": ["The Vale of Omens", "The Pantheon of Broken Worlds"], "arcSeam": "Plebury's genuine sky-readers have noticed the craters don't fall at random — a quiet thread toward the Broken Worlds cult and the cosmic restocking question. The ones who've said it out loud tend to stop being able to.", "legendary": null}, {"name": "Baywich, the City of Shrines", "region": "II — The Redgrass", "type": "settlement", "era": "Living (on old-world bones)", "terrain": "a crowded city thick with altars to a hundred old faiths", "holder": "contested — House Radiant moving in hard", "now": "Where the old world's scattered gods still keep altars, and new preachers fight for the crowds between them. Radiant is buying up and crowding out the little faiths one shrine at a time.", "threads": ["A Radiant takeover of an ancient shrine is turning violent.", "A priest of a dead faith remembers rites older than anyone should.", "The vanishings that follow Radiant everywhere have started here too."], "connections": ["House Radiant", "The Abbey of Fiery Ruin"], "arcSeam": "Some of Baywich's shrines predate the Tearfall, and one keeps a rite that remembers the before-time — including what the scaled folk were. Radiant wants it erased not for heresy but for what it could say. An early, deniable thread to the buried truth.", "legendary": null}, {"name": "Radun", "region": "V — The Spine", "type": "settlement", "era": "Living", "terrain": "a hardscrabble hamlet on the edge of the dead country", "holder": "free folk", "now": "A nothing town scraping by on thin grazing, with the Desolation of Hammesha creeping toward its western fields. The dead ground is in sight of the church now, and no one with power will say why it spreads.", "threads": ["A family's well went bad overnight.", "An Asher band has made the hamlet its base, and they're preparing for something.", "The town's about to abandon the western fields — and someone wants that land emptied."], "connections": ["The Desolation of Hammesha", "The Ashers"], "arcSeam": null, "legendary": null}, {"name": "Hafeld", "region": "II — The Redgrass", "type": "settlement", "era": "Living", "terrain": "a Sabine ranch-town, every house on company paper", "holder": "House Sabine", "now": "A company town in all but name — Sabine built it, feeds it, and holds the note on every roof. The stock here is the good stock, the bred stock, and the hands have learned not to ask what makes a single sire worth a dynasty.", "threads": ["A prize sire is gone — stolen, or did it arrange its own escape?", "A ranch hand has noticed the 'special' breeding barn no one is allowed near.", "A Sabine foreman is leaning hard on a family that fell behind on its debt."], "connections": ["House Sabine", "Dabryca Keep"], "arcSeam": "Hafeld's 'special' breeding barn is where Sabine breeds the thinking stock on purpose. Aware blood makes the richest dram, so the dynasty's true crop was never cattle — it's clever minds raised to understand exactly what will be done to them. The core Sabine atrocity, hidden behind a stud operation.", "legendary": null}, {"name": "Mawre Vale", "region": "V — The Spine", "type": "natural feature", "era": "Natural", "terrain": "wide open Sabine grazing rolling to the horizon under a huge sky", "holder": "House Sabine", "now": "Prime range — the kind of grass an empire is built on. Beautiful, and emptier than it should be: the herds give certain stretches a wide and knowing berth.", "threads": ["A line rider has gone missing on the far range.", "There's a water hole the stock simply will not touch.", "Storm season is coming, and the old hands are nervous in a way that has nothing to do with rain."], "connections": ["House Sabine"], "arcSeam": null, "legendary": "Open range is Ol' Thunderfoot's country — the titan bull runs with the front of the season's first great thunderstorm (miles flattened, far thunder on still days). Ranchers read the sign and move the herds; you survive its passing, you don't fight it."}, {"name": "The Desolation of Hulliha", "region": "II — The Redgrass", "type": "natural feature (blighted)", "era": "Contested", "terrain": "a vast dead salt-flat, the largest scar in the Redgrass", "holder": "shunned", "now": "The biggest of the dead grounds — a sea of cracked white where a Desolation has eaten the range for a generation and still spreads. Nothing crosses it by choice. The Ashers watch its rim; the Given's road skirts its far edge.", "threads": ["The Given need a guide across the dead ground, where no posse will follow.", "An Asher camp at the rim is preparing something that looks like a pilgrimage or a siege.", "A surveyor's stakes were found at the dead center. No surveyor."], "connections": ["The Ashers", "The Given", "The Bone Shepherd"], "arcSeam": "The largest Desolation is the largest blood-house — worked longest and hardest, its machine somewhere at or beneath the heart of the scar. This is the atrocity at industrial scale, a wound visible from the sky, and the place a party following the dead land finally finds the thing that makes it. (HIGH.)", "legendary": "The Bone Shepherd walks the dead-flats — twilight, drawn to carrion and defiled ground. Its range maps the hidden blood-houses: where the Shepherd's herd roams, a Desolation festers. The 'herd' is the weapon."}, {"name": "The Desolation of Saamsuma", "region": "II — The Redgrass", "type": "natural feature (blighted)", "era": "Contested", "terrain": "a dead scar wound around a witch's name", "holder": "shunned", "now": "The ground died here within living memory, and the plains folk tie it to the Witch Saamsinima, whose fortress stands ruined to the east. Whatever she did, the land has not forgiven it.", "threads": ["Her name still frightens the old folk into silence.", "A relic of the Witch is rumored at the scar's heart.", "The dead ground pulses faintly on certain nights, and the pulse is spreading."], "connections": ["The Fortress of Saamsinima the Witch", "The Ashers"], "arcSeam": "'The Witch' is how plains folk remember a defiler. Saamsinima was a blood-worker; her ruined fortress and this Desolation are the two ends of one crime. A personalized, deniable version of the truth — not a curse, a blood-house's wake.", "legendary": null}, {"name": "The Desolation of Hammesha", "region": "II — The Redgrass", "type": "natural feature (blighted)", "era": "Contested", "terrain": "a creeping dead-flat eating a poor stretch of range", "holder": "shunned", "now": "Smaller than Hulliha but hungrier at the edges — Hammesha takes Radun's fields a furlong a year, and nobody with power cares enough to ask why dead ground should grow.", "threads": ["A homesteader is fighting a losing war against the creeping edge.", "The Press is quietly mapping its spread and asking dangerous questions.", "An Asher will tell you exactly what it is — if you can stomach the hearing."], "connections": ["Radun", "The Press", "The Ashers"], "arcSeam": "A working blood-house, not a spent one — Hammesha spreads because the harvest here is active and near, hidden under some unremarkable Sabine holding. The creeping edge is the atrocity happening right now, which makes it the Desolation most likely to lead a party straight to a running machine. (HIGH.)", "legendary": null}, {"name": "Salt Waste", "region": "II — The Redgrass", "type": "natural feature", "era": "Natural", "terrain": "a natural salt pan — white and lifeless, but not wrong", "holder": "unclaimed", "now": "A true salt waste: barren, blinding, and clean in the way the Desolations aren't. This is how the land looks when it's merely dead, not murdered — and the difference is a lesson worth learning before you misread a scar.", "threads": ["A salt caravan works a route across it.", "Bones of some old disaster are surfacing as the pan shifts.", "A mirage keeps pulling travelers fatally off the path."], "connections": ["The Desolation of Hulliha"], "arcSeam": "DM contrast tool: Salt Waste is naturally barren; a Desolation is wrongly barren. A party that stands in both learns to tell an honest wasteland from a blood-house's scar — the first skill in reading the dead-flats as evidence.", "legendary": null}, {"name": "Scorched Earth", "region": "V — The Spine", "type": "natural feature (blighted)", "era": "Old-world", "terrain": "a blackened plain where nothing has grown back in centuries", "holder": "shunned", "now": "A wide burn that never healed. The plains folk say a great battle ended here; the truth is older and worse. The ground is warm in places it has no business being warm.", "threads": ["Old-world war-wreckage lies half-buried under the char.", "A relic survived the burning and still hums.", "The warm patches are moving, slowly, year to year."], "connections": ["The Keep of Fiery Ruin", "The Abbey of Fiery Ruin"], "arcSeam": "Scorched Earth may be kin to the Fiery Ruin twins — the signature of an early defiling catastrophe, a taking that went wrong at scale and burned the world black. The prehistory of the atrocity, written on the land. (Low.)", "legendary": null}, {"name": "The Dark Catacombs of Kas the Betrayer", "region": "IV — The Drownlands", "type": "dungeon", "era": "Old-world", "terrain": "a black labyrinth of vaults sunk beneath the drowned southern marges", "holder": "the dead", "now": "Kas the Betrayer left three marks on the world, and this is the deepest — a catacomb where he did his work far from any eye. Treasure-hunters avoid it. The ones who don't avoid daylight afterward, if they come up at all.", "threads": ["A scholar (or a Press agent) wants what Kas wrote on these walls.", "A Redhand crew went down a week ago and hasn't come up.", "There is a sealed inner vault that nothing has opened since Kas sealed it."], "connections": ["The Fortress of Kas the Betrayer", "The Fortress of Kas the Bloody", "The Vampire Empress"], "arcSeam": "KAS TRAIL — the central node. Kas learned the taking from Strahd and taught it to the Founding Families, who murdered him to own it. These catacombs hold the method and, for a party that reads them, the first hard proof that the Houses' founders killed their own teacher. A middle rung of the deepest reveal; also the key to Tatyana, whom Kas died trying to save. (HIGH — among the three most important sites in the region.)", "legendary": null}, {"name": "The Pantheon of Broken Worlds", "region": "II — The Redgrass", "type": "ruin", "era": "Old-world", "terrain": "a vast domed temple to the breaking of worlds", "holder": "the Broken Worlds cult", "now": "The grandest of the cult's seats — a Pantheon where those who worship, or mourn, the Tearfall still keep their rites and their pilgrims. Up close, the cult is stranger than the grief-struck visitors know.", "threads": ["A faction believes the breaking can be undone — or deliberately repeated.", "A relic here is said to 'remember the whole sky.'", "A schism is widening between those who mourn the Tearfall and those who welcome what it delivers."], "connections": ["The Shrine of Broken Worlds", "The Temple of Broken Worlds", "Plebury, the City of Omens"], "arcSeam": "BROKEN WORLDS SEAT. The inner cult knows the sky doesn't only break — it delivers, restocking a farmed world. This is the thread to the cosmic question above even Kas: what keeps the Fallow stocked, and was the Tearfall part of the machinery? (HIGH — cosmic-tier.)", "legendary": null}, {"name": "Dabryca Keep", "region": "II — The Redgrass", "type": "stronghold", "era": "Living (on old-world bones)", "terrain": "a fortified Sabine seat on an old-world foundation, watching the southern range", "holder": "House Sabine (a regional baron)", "now": "Seat of a Sabine baron who runs the eastern herds like a petty king. The Sabine stonework sits on something far older and deeper, and the baron's cellars go down past where the new walls end.", "threads": ["The baron wants deniable work done on a rival.", "There is a prisoner in the cellars who is not being treated like a prisoner.", "A Sabine succession is turning quietly lethal."], "connections": ["House Sabine", "Hafeld"], "arcSeam": "Dabryca's old-world cellars hold one of Sabine's blood-houses, fed by 'culled' stock — and, Hafeld being what it is, by the thinking stock that knows. The baron's real power is measured in dram he never names aloud.", "legendary": null}, {"name": "The Sanctuary of Carnage", "region": "II — The Redgrass", "type": "ruin", "era": "Old-world", "terrain": "a killing-ground given a terrible, reverent name", "holder": "the Ashers treat it as holy", "now": "Named without irony — a place where something was slaughtered at a scale no battle explains, long ago, and the name stuck as warning or boast. The Ashers tend it like a shrine. No one else goes near.", "threads": ["The Ashers gather here for reasons they won't share with outsiders.", "The bones are in numbers that add up to no war.", "The Ashers guard a relic of the slaughter with their lives."], "connections": ["The Ashers"], "arcSeam": "The Sanctuary of Carnage is a scaled-folk killing-ground from the Vanishing — a site of the first great harvest. The Ashers found it and venerate it as proof of what the world runs on. An Asher who trusts the party might show them what the bones truly are. (HIGH — hard evidence of the genocide.)", "legendary": null}, {"name": "The Catacombs of Elemental Evil", "region": "II — The Redgrass", "type": "dungeon", "era": "Old-world", "terrain": "a sprawling old-world dungeon themed to the four ruinous elements", "holder": "the dead (and worse)", "now": "A deathtrap out of the old world, built to the four elements turned cruel, that has swallowed treasure-hunters for centuries and keeps its appetite.", "threads": ["A cult is trying to reopen the deepest elemental node.", "A relic of raw elemental power is rumored intact far below.", "A survivor is selling a map that's three-quarters lies."], "connections": [], "arcSeam": null, "legendary": null}, {"name": "The ruins of Barad Ragi", "region": "II — The Redgrass", "type": "ruin", "era": "Old-world", "terrain": "tumbled towers and a cracked hall alone on the grass", "holder": "the dead", "now": "All that's left of the house of Ragi — whom the old records barely mention and the new ones not at all. Scavengers pick the stone and rarely find more than stone.", "threads": ["A genealogist (or Press agent) is trying to reconstruct who Ragi was, and why they were erased.", "A vault in the foundations resists every attempt to open it.", "Squatters have made the ruin a hideout and don't welcome company."], "connections": ["The Keep of Fiery Ruin"], "arcSeam": "Another old-world house scrubbed from record — like the nameless lord of the Fiery Ruin. A sharp party may notice the pattern: the Founding Families erased the names of those who knew too much at the start. (Low.)", "legendary": null}, {"name": "Poisoned Weald", "region": "II — The Redgrass", "type": "natural feature (blighted)", "era": "Contested", "terrain": "a woodland going slowly toxic from its roots up", "holder": "shunned", "now": "A forest not dead yet but dying wrong — leaves silvering, water turned bitter, animals in flight. It lies downwind and downstream of a Desolation, and it is catching whatever killed the flats.", "threads": ["A forester is documenting the spread and running out of time.", "There's a desperate effort to save the last clean grove.", "Something shelters in the poisoned heart that the blight will not touch."], "connections": ["The Desolation of Hulliha"], "arcSeam": "The Weald shows a Desolation's blight spreading past its scar — the atrocity leaks. A party watching the wood die can trace the poison upwind and upstream to its source: a working blood-house.", "legendary": null}, {"name": "Kashoy Desert", "region": "II — The Redgrass", "type": "natural feature", "era": "Natural", "terrain": "a red desert pocket cut by dead volcanic canyons, stranded in the southern grass", "holder": "unclaimed (Radiant causeways cross it)", "now": "The arid heart of the south — red sand, black lava rock, and canyons that vent old heat. Radiant's roads cross on raised causeways; step off the causeway and you belong to the desert.", "threads": ["A causeway station has gone silent.", "A prospector found something in a smoking vent and won't say what.", "Storm season is burying the trail a dune at a time."], "connections": [], "arcSeam": null, "legendary": "The Ashmaw dens in the canyon vents — it surfaces only at night after a day of tremor, drawn to fire; hunters bait it with a bonfire on shaking ground, and mostly die for it. DM: serpentine and wrong-old, it is the last shape the serpent-kin's memory took — a living echo of the vanished scaled folk."}, {"name": "Arnah", "region": "III — The Scald", "type": "settlement", "era": "Living", "terrain": "a white cathedral-city blazing against the red desert", "holder": "House Radiant (Scald seat)", "now": "Radiant's shining seat in the south — a white cathedral-city where the desert's desperate come to be healed and to believe. The wall never dims, the faithful never hunger, and the faith never stops asking for more.", "threads": ["Pilgrims are arriving faster than the wells can hold.", "A new 'miracle' is drawing crowds — and the usual quiet trickle of the ascended who are never seen again.", "An inquisitor is hunting a witness who fled behind Arnah's wall."], "connections": ["House Radiant", "The Holy City of Baleah"], "arcSeam": "Arnah is Radiant's atrocity on home ground — a blood-house beneath the cathedral, the brightest desert wall fed on the premium human tier, converts who 'ascend' into the drains. The harvest here is older and better-practiced than at the western missions. (HIGH.)", "legendary": null}, {"name": "Tricca", "region": "III — The Scald", "type": "settlement", "era": "Living", "terrain": "a dusty mission-town on the Scald’s northern verge, below the Spine, on the pilgrim road", "holder": "House Radiant (mission)", "now": "A mission-town where Radiant feeds the hungry and shelters the lost — and where the lost are sometimes saved so completely they're never seen again. The townsfolk love the mission. They have to.", "threads": ["A family is asking after a son who 'took vows' and vanished.", "A mission almoner has begun, quietly, to doubt.", "A Given cell is smuggling the marked out past the mission's eyes."], "connections": ["House Radiant", "The Given"], "arcSeam": "A working Radiant harvest-pipeline, small-scale and deniable, laundered as devotion. A party that follows one vanished convert to its end finds the floor of the whole secret. (medium.)", "legendary": null}, {"name": "Anigh", "region": "III — The Scald", "type": "settlement", "era": "Living", "terrain": "a proud free desert town, thirsty and watched", "holder": "free folk", "now": "One of the few Scald towns that never took Radiant's wall, and it pays in isolation and fear. The people are proud and parched, and the missions circle like it's only a matter of time.", "threads": ["Radiant is pressuring the town to 'come to the wall.'", "A water war is brewing with a Radiant-held neighbor.", "The town is hiding a heretic preacher the inquisition wants."], "connections": ["House Radiant"], "arcSeam": null, "legendary": null}, {"name": "Coaton", "region": "III — The Scald", "type": "settlement", "era": "Living", "terrain": "a hardbitten mining camp over a dram-vein", "holder": "free / dram money rules", "now": "Where the Scald's dram is dug — a rough camp over a rich vein that drew prospectors and all the trouble that follows them. Radiant preaches here but doesn't rule; the vein does.", "threads": ["A cave-in has uncovered something old in the rock.", "Two outfits are feuding over the richest face.", "A Redhand buyer is paying over market, no questions asked."], "connections": [], "arcSeam": null, "legendary": null}, {"name": "Narthy", "region": "III — The Scald", "type": "settlement", "era": "Living", "terrain": "a chapel, a well, and a few houses on the pilgrim road", "holder": "House Radiant", "now": "Barely a town — but the well is Radiant's, so the town is Radiant's. Pilgrims rest here on the road to Arnah, and some rest longer than they meant to.", "threads": ["A pilgrim died on the road and the chapel won't release the body.", "A lay-sister sees too much and is beginning to say so.", "The well is running low, and Radiant is rationing it by faith."], "connections": ["House Radiant"], "arcSeam": null, "legendary": null}, {"name": "Gabizir", "region": "V — The Spine", "type": "settlement", "era": "Living", "terrain": "a remote outpost where the desert road climbs into the Spine", "holder": "free folk", "now": "The last town before the deep waste and the border country — a smuggler's rest, a fugitive's hope, and nobody's idea of safe.", "threads": ["A wanted outfit is laying up here between jobs.", "A caravan needs an escort through country that eats escorts.", "Something has been following travelers in from the waste."], "connections": [], "arcSeam": null, "legendary": null}, {"name": "Hairi Waste", "region": "III — The Scald", "type": "natural feature", "era": "Natural", "terrain": "a wind-flayed waste of grit and leaning standing stones", "holder": "unclaimed", "now": "A hard crossing between the Kashoy and the north, studded with old markers no living faith will claim. The wind here strips paint, then leather, then skin.", "threads": ["The standing stones align to something no one has walked out to confirm.", "A lost party's trail leads into the stones and stops.", "A flaying storm is building on the horizon."], "connections": [], "arcSeam": null, "legendary": null}, {"name": "The Desolation of Sangusu", "region": "III — The Scald", "type": "natural feature (blighted)", "era": "Contested", "terrain": "a dead scar half-swallowed by advancing sand", "holder": "shunned", "now": "A Desolation the desert is quietly burying — older and stiller than the Redgrass scars, its edges softened by dunes but its wrongness intact beneath them. The sand uncovers it and hides it again by turns.", "threads": ["An Asher pilgrim is seeking the scar for reasons of their own.", "The dunes keep shifting to re-expose the dead center.", "Whatever sits at the heart stays bare no matter how the sand moves."], "connections": ["The Ashers"], "arcSeam": "An old, spent blood-house scar — and the desert hides the Scald's crimes better than the plains hid the Redgrass's. The Houses favor the desert for exactly that reason: sand keeps secrets. (medium.)", "legendary": null}, {"name": "The Desolation of Ossunit", "region": "III — The Scald", "type": "natural feature (blighted)", "era": "Contested", "terrain": "a dead-flat with a Radiant chapel standing at its rim", "holder": "House Radiant (watched)", "now": "Unusually, a Radiant chapel sits at this Desolation's edge, and the faithful are taught the dead ground is holy — the site of an ancient 'cleansing.' Pilgrims leave offerings at the rim and are forbidden to cross.", "threads": ["A pilgrim crossed the dead ground on a dare and came back changed.", "The chapel's reliquary is kept beyond the scar, not before it.", "A novice wants to know what was 'cleansed' here, and asking is dangerous."], "connections": ["House Radiant", "The Ashers"], "arcSeam": "Radiant has dressed one of its own blood-house scars as a holy 'cleansing site' — the atrocity rebranded as miracle, the dead ground venerated by the very people it was made from. The purest distillation of Radiant's lie. (HIGH.)", "legendary": null}, {"name": "The Bastion of the Wyrm Emperor", "region": "IV — The Drownlands", "type": "ruin", "era": "Old-world", "terrain": "a lair out of legend, lost somewhere in the drowned country", "holder": "the dead (if it exists at all)", "now": "Every frontier child knows the tale: the Wyrm Emperor, demon-king of the scaled, whose return the faithful are taught to dread. His lair is lost somewhere in the drowned country, and the story says if you find it you'll find only bones. Most say it never existed.", "threads": ["A mad prospector swears he found the lair and will lead you there.", "Radiant preaches the Emperor's return as the coming end-times.", "A scholar hunting the real site has vanished into the canyons."], "connections": [], "arcSeam": "THE WARNING-TALE. The Wyrm Emperor is long dead and his lair is only bones — but the TALE does an army's work. It villainizes the scaled folk: pity ('died of the drought') and fear ('beware the demon's return') together mean nobody mourns them, wants them back, or digs. Radiant preaches it hardest, because 'beware the demon' is how the church will get the people to kill the scaled ones when they return (the Kinline, survivors) — the grandchildren finishing the founding crime and calling it faith. DEEP LEVER: if the lair is ever found, the bones aren't the Emperor's victims — they're his people, a harvest-grave. (HIGH — core scaled-folk theme.)", "legendary": null}, {"name": "Caer Olfin", "region": "V — The Spine", "type": "stronghold (ruin)", "era": "Old-world", "terrain": "a wind-scoured old-world fort on a high mountain crag", "holder": "unclaimed (squatted)", "now": "A pre-Tearfall fort perched to watch the canyon roads, abandoned so long its garrison is a mystery. Bandits and worse shelter in its shell and light its old signal-pans when they want to lie.", "threads": ["An outfit is holed up inside and doesn't take visitors.", "Someone has been relighting the old signal-fires.", "The fort holds the only safe way down into the canyon."], "connections": [], "arcSeam": null, "legendary": null}, {"name": "The Fortress of Thildeba the Lunatic", "region": "III — The Scald", "type": "ruin", "era": "Old-world", "terrain": "the ruined seat of a mad old-world sorcerer-lord", "holder": "the dead", "now": "Thildeba the Lunatic ruled here before the Tearfall and raised works no sane builder would. Like Ocus far to the west, a monument to one ruined mind — and, the tales say, a dabbler in things better left buried.", "threads": ["A relic of Thildeba's madness is rumored intact below.", "Survivors come back speaking only in riddles.", "A Redhand expedition is recruiting a fourth with a strong stomach."], "connections": ["The Citadel of Ocus the Deranged"], "arcSeam": "Thildeba, like Ocus, is likely old-world prehistory of the taking — a pre-Kas dabbler driven mad by blood-power before anyone made it a trade. The pattern of mad lords is a thread for a party connecting the dots back toward the first defilings. (low.)", "legendary": null}, {"name": "Taford Stronghold", "region": "III — The Scald", "type": "stronghold", "era": "Living (on old-world bones)", "terrain": "a holdfast guarding the pass between the Scald and the east", "holder": "a Radiant-aligned warlord", "now": "Whoever holds Taford holds the road, and right now that's a warlord who swears to Radiant and calls his tolls tithes. The pass is the only easy way east out of the desert, and he knows it.", "threads": ["The warlord's grip is slipping and the vultures are circling.", "A caravan is refusing the 'tithe' and daring him to act.", "There's a prisoner in the holdfast worth more free than caged."], "connections": ["House Radiant"], "arcSeam": null, "legendary": null}, {"name": "Batun, City of the Clockwork", "region": "III — The Scald", "type": "ruin", "era": "Old-world", "terrain": "a half-dead city of stopped machines and silent automata", "holder": "free folk living among the ruins", "now": "One of the old world's two Clockwork cities — a marvel of gears and automata that ran on the Weave and froze when the Weave broke. People scavenge the works now, and some of the works are not as stopped as they look.", "threads": ["A long-dead clockwork has started moving again.", "A scavenger guild is hoarding the finest mechanisms.", "A Meridian agent is buying old automata and won't say why."], "connections": ["Waham, City of the Clockwork"], "arcSeam": "The Clockwork cities are the old world's lost artifice, dead since the Tearfall — a measure of how much the breaking cost, and a thread for anyone asking what the world was before it ran on blood. (low.)", "legendary": null}, {"name": "The Garden City of Maford", "region": "III — The Scald", "type": "ruin", "era": "Old-world", "terrain": "a ruined oasis-city, its green gone to thorn and its fountains to dust", "holder": "the Maford line (a few stubborn families remain)", "now": "Once the jewel of the Maford house — a green city in the desert, fed by old-world works now failing. The gardens have gone to thorn, the fountains to dust, and a few families still live in the shade of what was.", "threads": ["The old irrigation might be restarted by someone who understands the before-time.", "A would-be Maford heir has come seeking the family seat.", "Something nests in the dry fountains and hunts the thorn-paths."], "connections": ["Maford Tower", "Maford Castle"], "arcSeam": "The Maford line again — one old-world house, many seats. The Garden City's deep archives, if the thorns can be beaten back, may hold the before-time records the Tower only hinted at. (low.)", "legendary": null}, {"name": "Kneawich Castle", "region": "IV — The Drownlands", "type": "stronghold", "era": "Living (on old-world bones)", "terrain": "a brooding castle over the roads where the dry country sinks into the fen", "holder": "a Radiant-aligned lord", "now": "A grim keep watching the causeways where the Redgrass gives way to the Drownlands’ edge.", "threads": ["The lord is hunting an escaped 'heretic' across the desert.", "A betrothal is being used as a very comfortable cage.", "Old passages run beneath the castle to somewhere the lord doesn't know about."], "connections": ["House Radiant"], "arcSeam": null, "legendary": null}, {"name": "Leford", "region": "VI — The Greenreach", "type": "settlement", "era": "Living", "terrain": "a ford-town where the desert finally yields to greener country", "holder": "free / mixed", "now": "The crossing where the Scald's sand gives way to the Greenreach's forests — a mixing-place of desert folk and forest folk.", "threads": ["A feud is simmering between desert and forest families.", "A Meridian survey is eyeing the ford for the rail.", "Smugglers run contraband through the crossing under honest cargo."], "connections": [], "arcSeam": null, "legendary": null}, {"name": "Caer Colla", "region": "III — The Scald", "type": "stronghold (ruin)", "era": "Old-world", "terrain": "a collapsed old-world keep half-swallowed by the canyon maze", "holder": "the dead", "now": "A pre-Tearfall keep the canyons have taken, its halls open to the sky where the rock gave way. A good place to die of a long fall or a short ambush.", "threads": ["A relic waits in the collapsed undervault, if the collapse can be survived.", "The ruins hide a Redhand drop-point.", "A survivor is selling a map to the 'treasure level' that got everyone else killed."], "connections": [], "arcSeam": null, "legendary": null}, {"name": "The ruins of Castle Ravenloft (West)", "region": "III — The Scald", "type": "stronghold (ruin)", "era": "Old-world", "terrain": "a black castle on a crag wreathed in a mist that never lifts", "holder": "Strahd", "now": "One of two places the mists have set the same cursed castle down — a gothic pile on a lonely crag above the Scald basin, where the fog pools in every season. The valley folk below pay a tithe to be left alone, and mostly, they are.", "threads": ["A bride-to-be in the valley has been 'noticed' by the castle.", "A scholar went up to study the mist and his letters are growing stranger.", "The tithe has come due and the valley can't pay it."], "connections": ["The ruins of Castle Ravenloft (East)", "The Tower of the Vampire Empress", "The Bastion of the Vampire Empress"], "arcSeam": "STRAHD — the ur-source. The vampire who always knew blood IS power, who taught the mortal Kas the art of taking it, and from whom the entire dram economy descends. He is no ruin; he endures (undeath needs no Weave), the deepest and oldest witness alive — older than the crime, because he is its root. The two Ravenlofts are one domain the mist set down twice. The absolute floor of the reveal, reachable only at terrible cost and only very late. (HIGHEST.)", "legendary": null}, {"name": "The Tower of the Vampire Empress", "region": "III — The Scald", "type": "stronghold (ruin)", "era": "Old-world", "terrain": "a lone black spire on a high, cold ridge", "holder": "the Vampire Empress", "now": "Her second seat — higher, colder, and farther than the western Bastion. The spire where the Empress withdrew when the world forgot her, and from which, the mountain folk whisper, she still watches the roads to the Houses she can never reach.", "threads": ["Her agents — or things that serve her — move on the ridge roads.", "A Warden's courier was found drained at the tower's foot.", "Someone down in the valley has started leaving her offerings."], "connections": ["The Bastion of the Vampire Empress", "The ruins of Castle Ravenloft (West)", "Strahd"], "arcSeam": "Tatyana's second throne. Taken by Strahd, left without a savior when the Families killed Kas, sealed into the Empress — and here in the cold she has run her ~300-year war on the Houses and lost every round, a Bilderberg-tier elite she cannot touch. She has the truth and no vessel. Higher and later in her reveal ladder than the Bastion: the Bastion is where a party first feels her; the Tower is where, once they're a real piece on the board, the cold offer is made. Never a friend, never free. (HIGHEST.)", "legendary": null}, {"name": "The Fortress of Kas the Betrayer", "region": "V — The Spine", "type": "ruin", "era": "Old-world", "terrain": "a shattered fortress on a knife-ridge, its gate torn open from within", "holder": "the dead", "now": "The first of Kas's three seats, bearing his great epithet. The gate was broken from the inside, as though what was meant to be kept out was already in. The Treaty-kept will not set foot on the ridge.", "threads": ["A relic of the Betrayer is rumored in the keep.", "A Redhand crew won't go past the gate and won't say why.", "Old carvings tell a story the valley priests keep trying to chisel away."], "connections": ["The Dark Catacombs of Kas the Betrayer", "The Fortress of Kas the Bloody", "Strahd"], "arcSeam": "KAS TRAIL — the origin seat. 'The Betrayer': Kas learned Strahd's art and turned it on the scaled folk — but the truer telling is that he was betrayed and murdered here by the Founding Families he'd taught, who wanted the power for themselves. The carvings the priests scrape away are the record of the founding crime. The first rung for a party climbing the whole trail; connects to Tatyana, whom Kas died trying to save. (HIGH.)", "legendary": null}, {"name": "The Fortress of Kas the Bloody", "region": "V — The Spine", "type": "ruin", "era": "Old-world", "terrain": "a red-stoned fortress steeped in old slaughter", "holder": "the dead", "now": "The last of Kas's three seats — where the Betrayer earned his other name. The stone is red, and not all of it was quarried that way. The violence here is old enough that even the scavengers keep their voices down.", "threads": ["The deepest vault has never once been opened.", "Something still 'keeps' the fortress.", "A scholar cross-referencing all three Kas sites went missing in these halls."], "connections": ["The Fortress of Kas the Betrayer", "The Dark Catacombs of Kas the Betrayer"], "arcSeam": "KAS TRAIL — the terminal seat, where the method reached its cruelest refinement. A party that has read the Betrayer's fortress and the Dark Catacombs finds here the full shape of what Kas learned and what the Families killed him to take: the complete floor of the deepest reveal, and the Akasha truth — the source is already dead, so the evil can't be ended by killing anyone. (HIGH.)", "legendary": null}, {"name": "Hastithorp, the City Under the Mountain", "region": "V — The Spine", "type": "settlement", "era": "Living (old-world core)", "terrain": "a great city delved into the living roots of a mountain", "holder": "the long-lived remnant, with free folk", "now": "The old world's mountain capital, delved deep into living rock — and one of the last places the long-lived peoples still endure in number. The frontier's final true city of the old races: dwindling, fortified, unbowed. The Houses want its deep ways for ore and worse, and Hastithorp keeps its gates shut.", "threads": ["A House delegation is pressing hard for mining rights into the deep holds.", "A young heir of a long-lived house has vanished — the only kind of vanishing still investigated here.", "The deepest delvings have struck something sealed, and the elders have forbidden digging further."], "connections": ["Kiali's Hold", "Nionevriath", "The Treaty-kept"], "arcSeam": "Hastithorp is where the long-lived remnant clusters — which makes it both a standing refutation of the Houses' order and a standing temptation: premium, non-renewable blood, gathered in one walled place. It holds because it is fortified and watchful, but to a Warden every long-lived life inside is a vintage waiting to be taken. Demographics-as-symptom made into a siege that has lasted generations. (HIGH.)", "legendary": null}, {"name": "Nionevriath", "region": "I — The Sunder Basin", "type": "ruin", "era": "Old-world", "terrain": "a silver-named garden-enclave of the old long-lived peoples, mostly empty", "holder": "the long-lived remnant", "now": "Once a garden-hold of the long-lived, now more memorial than living — a handful of the old folk keeping faith with empty halls and a great many graves. Beautiful, sorrowful, and quietly watched by eyes that count.", "threads": ["An elder remembers the Vanishing and will not speak of it.", "Grave-robbers are after long-lived remains, worth a fortune to the wrong buyer.", "A House agent is in the valley, counting the survivors."], "connections": ["Hastithorp", "The Treaty-kept"], "arcSeam": "Nionevriath is demographics-as-symptom made personal: a long-lived people harvested toward extinction, their near-empty enclave a smaller, slower echo of the scaled folk's fate. The graves are robbed because long-lived remains are premium material even dead. An elder here may hold truths older than any human record — and a grief that rhymes with the Empress's. (HIGH.)", "legendary": null}, {"name": "Kiali's Hold", "region": "V — The Spine", "type": "stronghold", "era": "Living (old-world)", "terrain": "a fortified clan-hold on a high pass", "holder": "an old-blood clan, answering to no House", "now": "A proud hold guarding a high pass, kept by a clan that remembers the old world firsthand and bows to no House. Travelers pay the toll or take the long way, and the clan's word is iron.", "threads": ["The pass is the only winter route, and the clan is choosing who may use it.", "A blood-feud with a neighboring hold is turning hot.", "A House agent is trying to buy the clan, or break it."], "connections": ["Hastithorp"], "arcSeam": "An old-blood hold that remembers too much to be comfortable, and stands outside the Houses' reach — which marks it, quietly, for the same slow pressure closing on every long-lived holdout. (low.)", "legendary": null}, {"name": "Fiunch, the City Beneath the Spire", "region": "VI — The Greenreach", "type": "settlement", "era": "Living (old-world)", "terrain": "a high-valley city in the perpetual shadow of one colossal spire", "holder": "free / mixed", "now": "Built in the shadow of a spire no one remembers raising, Fiunch is a trade-city of the high valleys — cold, proud, keeping its own counsel. The spire hums on certain nights, and lately the nights are more often.", "threads": ["The spire's hum is growing stronger.", "A cult has grown up around the spire and its 'song.'", "A Meridian survey is trying to route the rail through the valley and past the spire."], "connections": [], "arcSeam": "The spire is old-world work of unknown purpose — perhaps a Weave-anchor, perhaps an instrument of (or witness to) the Tearfall. Its waking hum is an optional deep thread toward what actually broke the world. (medium.)", "legendary": null}, {"name": "The Forbidden City of Pahyrst", "region": "V — The Spine", "type": "ruin", "era": "Old-world", "terrain": "a sealed, intact old-world city high in the peaks", "holder": "the dead (and watchers)", "now": "No ruin — a whole city, high and cold and shut, that the old world itself sealed and forbade, its gates barred from without by a law whose reason no one now remembers. The Treaty-kept enforce the ban to this day.", "threads": ["Someone has broken the seal.", "The Treaty-kept are hunting whoever did it.", "Whatever the old world locked away is still in there, intact and waiting."], "connections": ["The Treaty-kept"], "arcSeam": "Pahyrst was sealed by the old world for a reason the Treaty-kept still honor without fully remembering — a truth, a weapon, or a horror from before the Tearfall. The ban itself is the message: some things the old world knew to bury. What's inside could rewrite the reveal, or end a party that opens it. (medium.)", "legendary": null}, {"name": "Frostwood Forest", "region": "III — The Scald", "type": "natural feature", "era": "Natural", "terrain": "a silent frost-forest on the Scald basin’s northern edge, climbing toward the Spine", "holder": "unclaimed / Treaty-kept", "now": "Where the Spine turns truly cold — frost-rimed old growth climbing into the high north, silent but for settling snow. Few go deep, and fewer in winter.", "threads": ["A Treaty-kept winter camp holds the only safe shelter.", "Trappers speak of a 'hill that wasn't there last year.'", "A route north opens only in the deep freeze."], "connections": ["The Hoarfather"], "arcSeam": null, "legendary": "The Hoarfather sleeps in the deep cold beyond the Frostwood — an ancient armored titan mistaken for a ridge or a mossy hill, stirring only on the longest night of winter, and only for something that wakes it. DM: it is older than the Flood, maybe older than the Tearfall; it remembers the world before the scaled folk vanished — the one witness that is neither undead nor a record, only old. (HIGH.)"}, {"name": "Drakecrags", "region": "V — The Spine", "type": "natural feature", "era": "Natural", "terrain": "jagged black peaks the old songs call the dragon-crags", "holder": "unclaimed", "now": "Knife-edged peaks that the oldest songs name for the drakes that once nested here, though no living soul has seen one. The wind through the crags sounds, some swear, like something still calling.", "threads": ["A nest-sized hollow sits high and long-cold in the crags.", "A song-keeper in the foothills still knows the old drake-lore.", "Something answers the wind, faintly, from above."], "connections": ["The Bastion of the Wyrm Emperor"], "arcSeam": "The Drakecrags remember the scaled in their very name — dragon country, before the Vanishing. A thread of the scaled folk's lost world, and a place the Wyrm Emperor's truth might still echo for anyone who can read the old songs. (low.)", "legendary": null}, {"name": "The Shrine of Broken Worlds", "region": "I — The Sunder Basin", "type": "ruin", "era": "Old-world", "terrain": "the oldest and highest seat of the Broken Worlds cult, carved into a peak", "holder": "the Broken Worlds cult", "now": "The first and highest of the cult's three seats, cut into a summit where, they say, the Tearfall itself could be watched. Pilgrims climb to grieve the breaking; the keepers climb to watch the sky.", "threads": ["A keeper has seen something coming in the sky and won't come down.", "A relic here is said to show 'the night the world broke.'", "The climb kills the unworthy, or the cult makes sure it does."], "connections": ["The Pantheon of Broken Worlds", "The Temple of Broken Worlds"], "arcSeam": "The highest Broken Worlds seat, where the cult watches the sky for what it delivers. The keepers here likely know the most of anyone about the craters and the restocking — the cosmic question above even Kas. Remote, guarded, and holding a piece of the deepest answer. (medium-HIGH.)", "legendary": null}, {"name": "The Monastery of Eternal Night", "region": "V — The Spine", "type": "ruin", "era": "Old-world", "terrain": "a high mountain monastery sworn to a darkness older than the sun", "holder": "the Eternal Night order (gone, or changed)", "now": "An order that worshipped a night older than the world, kept in a cold cloister near the peaks. The brothers are long gone or long changed, and the dark in the halls is the kind that looks back at you.", "threads": ["A surviving — or returned — brother still keeps the cloister.", "A rite the order guarded should not be completed, and someone intends to.", "The dark deepens the further in you go, past where torches help."], "connections": ["The Keep of Eternal Night", "Strahd"], "arcSeam": "Eternal Night may be bound to Strahd and the Empress — a cult of the undying dark, perhaps the faith that first served the vampire root before Kas was ever born. A thread toward the oldest powers in the world. (medium.)", "legendary": null}, {"name": "The Keep of Eternal Night", "region": "VI — The Greenreach", "type": "ruin", "era": "Old-world", "terrain": "a black keep that no dawn has ever lit", "holder": "the Eternal Night order", "now": "The martial seat of the Eternal Night order, where the dark is permanent — torches gutter, lanterns dim, and the sun's light simply never reaches the stones.", "threads": ["Something garrisons the keep that doesn't need the light.", "A weapon of the order is sealed in the lightless depths.", "The dark is spreading beyond the walls, a little further each winter."], "connections": ["The Monastery of Eternal Night"], "arcSeam": "The order's two seats — the Keep is where the dark was wielded, not merely worshipped. A deep thread toward the undying powers, bound to the same root as Strahd. (medium.)", "legendary": null}, {"name": "The Tomb of Horrors", "region": "V — The Spine", "type": "dungeon", "era": "Old-world", "terrain": "the old world's most infamous deathtrap, sunk in a lonely hill", "holder": "the dead", "now": "The name alone empties taverns. A tomb the old world built not to protect anything but simply to kill — and it has never once stopped. Fortunes and famous names have gone down into it. Nothing has come up.", "threads": ["A fresh expedition is recruiting, and doomed.", "A map to the tomb has killed everyone who has used it.", "A relic of unimaginable worth is 'confirmed' at the bottom, as it always is."], "connections": [], "arcSeam": null, "legendary": null}, {"name": "Caer Malde", "region": "IV — The Drownlands", "type": "stronghold (ruin)", "era": "Old-world", "terrain": "a broken old-world fortress where the mountains meet the drowned lowland", "holder": "the dead (squatted)", "now": "A tumbled fortress where the Spine's western foot sinks into the drowned lowland — a landmark, a lair, and a waypoint, picked over for centuries and still holding its deepest rooms shut.", "threads": ["Squatters have claimed the upper halls.", "A sealed vault resists every key.", "A passage behind the keep runs back into the mountain itself."], "connections": ["Froby Stronghold"], "arcSeam": null, "legendary": null}, {"name": "Froby Stronghold", "region": "IV — The Drownlands", "type": "stronghold", "era": "Living (old-world)", "terrain": "a garrisoned hold on the Drownlands’ northern lip, watching where the western range meets the fen", "holder": "a free warlord — Meridian circling", "now": "One of the few holds on the Drownlands' northern edge still manned — a strongpoint over the western approaches that Meridian would give a great deal to own for the rail.", "threads": ["Meridian is pressuring the holder to sell or submit.", "A feud simmers with the squatters of nearby Caer Malde.", "A caravan is seeking shelter the holder isn't sure he can give."], "connections": ["House Meridian", "Caer Malde"], "arcSeam": null, "legendary": null}, {"name": "Barukthizd Spires", "region": "V — The Spine", "type": "natural feature", "era": "Old-world", "terrain": "needle peaks crowned with the ruins of unreachable eyries", "holder": "the dead", "now": "Stone needles topped with the ruins of eyries no remembered path can reach. The old world built high here, for reasons gone with it.", "threads": ["There may be a way up, for the brave or the mad.", "Something still roosts in the high ruins.", "A relic is visible from below and reachable by no one."], "connections": ["Nargathund Spires"], "arcSeam": null, "legendary": null}, {"name": "Nargathund Spires", "region": "V — The Spine", "type": "natural feature", "era": "Old-world", "terrain": "a second crown of needle peaks and dead eyries", "holder": "the dead", "now": "Sister-spires to the Barukthizd, sharing their height and their silence, framing a high dead valley that nothing living crosses.", "threads": ["The dead valley between the spires is unmapped.", "The two crowns of eyries may once have been linked.", "A storm lives in the valley and never fully leaves."], "connections": ["Barukthizd Spires"], "arcSeam": null, "legendary": null}, {"name": "Lappussa Fells", "region": "V — The Spine", "type": "natural feature", "era": "Natural", "terrain": "high, cold moorland above the treeline", "holder": "the Treaty-kept", "now": "Bleak upland fells where only the hardiest stock and the Treaty-kept's herds graze the short cold season. The mist comes fast and kills the lost.", "threads": ["A Treaty-kept herd-camp holds the high ground.", "A standing circle sits out in the fells, older than the herding.", "A sudden storm has stranded travelers above the treeline."], "connections": ["The Treaty-kept"], "arcSeam": null, "legendary": null}, {"name": "Zaragzan", "region": "V — The Spine", "type": "settlement", "era": "Living", "terrain": "a hard mining town clinging high in the crags", "holder": "free folk", "now": "A cold, tough town hanging off the peaks, digging ore and the occasional fresh-fallen dram from a high crater. Isolated, armed, and slow to trust a stranger.", "threads": ["A crater fell just above town and the race for it is on.", "A cave-in has trapped a crew in the deep workings.", "A stranger is asking about the old roads through the range."], "connections": [], "arcSeam": null, "legendary": null}, {"name": "Gela Hills", "region": "V — The Spine", "type": "settlement", "era": "Living", "terrain": "rolling foothills where the Spine eases toward the lowlands", "holder": "free / mixed", "now": "Gentler country where the great range calms into grazing hills — a buffer of farms and holdings between the mountains and the plains, coveted by everyone who wants the passes it guards.", "threads": ["A border dispute over the hill grazing is turning ugly.", "A hill-fort is for sale cheap — too cheap.", "Raiders are coming down out of the high country."], "connections": [], "arcSeam": null, "legendary": null}, {"name": "Gloomwood Forest", "region": "V — The Spine", "type": "natural feature", "era": "Natural", "terrain": "a dark, close forest on the Spine's lower shoulders", "holder": "the Treaty-kept / unclaimed", "now": "A forest where the canopy swallows the light and the path
