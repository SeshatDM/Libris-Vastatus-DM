s close behind you — old, watchful woods the Treaty-kept know and outsiders rightly fear.", "threads": ["A Treaty-kept warden tests travelers before letting them pass.", "Something in the wood herds the lost deeper in.", "A hidden way through the mountains runs under the dark canopy."], "connections": ["The Treaty-kept"], "arcSeam": null, "legendary": null}, {"name": "Sewich, City of the Deadly Sins", "region": "IV — The Drownlands", "type": "settlement", "era": "Living", "terrain": "a gaudy river-city of gambling halls and pleasure-boats on stilts and barges", "holder": "free vice — House Merrow holds the debts", "now": "The Drownlands' wicked jewel — a sprawling, floating city of gambling, drink, and every sin a coin can buy, strung along the river on pilings and lashed-together barges. Merrow owns the paper on all of it; everyone in Sewich owes someone, and that someone owes Merrow.", "threads": ["A riverboat gambler is into Merrow for more than his life is worth.", "A pleasure-house's patrons have started vanishing between the sheets.", "Two gambling bosses are one insult from turning the waterfront into a battlefield."], "connections": ["Honargul, City of the Deadly Sins", "House Merrow", "Dushmoor River"], "arcSeam": "Not all of Sewich's vanishings are foul play of the ordinary kind. A sin-city is a perfect harvest ground — debtors, runaways, and the drowned-in-the-river are nobody's to miss — and Merrow launders a quiet human-tier harvest through vice and debt. The cleanest hands on the Table do their taking where no one counts. (medium.)", "legendary": null}, {"name": "Altneyn, the Throne of the Gods", "region": "IV — The Drownlands", "type": "ruin", "era": "Old-world", "terrain": "a half-submerged old-world temple-city, domes rising from black water", "holder": "the drowned", "now": "Once the holiest city of the old world, where the gods themselves were said to be enthroned — now sunk to its domes in the swamp, its god-halls full of black water and whatever swims in it. Pilgrims and plunderers both come. Few of either leave.", "threads": ["A relic of the old gods waits in the flooded inner sanctum.", "A cult believes the gods will rise again when the water does.", "A diver has mapped the sunken halls and won't sell the map at any price."], "connections": [], "arcSeam": "Altneyn held the old world's gods, and whatever the Tearfall did, it drowned them here. A party that plumbs the sunken god-halls may learn what the old faith truly was and what the breaking of the Weave did to the divine — a deep, optional thread, and a superb dungeon. (medium.)", "legendary": null}, {"name": "The Citadel of Sallaba the Infernal", "region": "IV — The Drownlands", "type": "ruin", "era": "Old-world", "terrain": "a black citadel rising from the deep swamp, named for its tyrant", "holder": "the dead", "now": "The fastness of Sallaba the Infernal, an old-world tyrant whose cruelty earned the name, now a swamp-drowned ruin that the bayou folk swear still burns somewhere deep in its heart.", "threads": ["A relic of the tyrant's reign lies in the flooded keep.", "An eternal fire is rumored still lit in the depths.", "Something rules the ruin now that keeps to Sallaba's old ways."], "connections": ["The Citadel of Ocus the Deranged", "The Fortress of Thildeba the Lunatic"], "arcSeam": "Another old-world tyrant — Infernal, Deranged, Lunatic — whose cruelty may trace back to blood-power's prehistory. The pattern of mad and monstrous lords is a quiet thread toward the first defilings, before Kas made the taking a trade. (low.)", "legendary": null}, {"name": "Noport Keep", "region": "IV — The Drownlands", "type": "stronghold", "era": "Living (old-world)", "terrain": "a decaying fort over a silted, dead river-mouth", "holder": "a river-boss", "now": "Named without hope — a port-keep whose harbor silted shut generations ago, now a half-sunk fort ruled by a river-boss who taxes everything that poles past on the one channel still open.", "threads": ["The old boss is dying and his lieutenants are already circling.", "A wreck in the silt is worth salvaging, if the boss doesn't catch you.", "He's strung a chain across the channel and the traders are furious."], "connections": [], "arcSeam": null, "legendary": null}, {"name": "Beabrook", "region": "IV — The Drownlands", "type": "settlement", "era": "Living", "terrain": "a stilted river-town where the swamp meets navigable water", "holder": "free / mixed — a Merrow factor's office", "now": "A working river-town up on pilings — fishers, trappers, traders, a Merrow factor squeezing the debts, and a frontier church locked in a quiet war with the older bayou beliefs.", "threads": ["A Merrow debt is about to take a family's boat and livelihood.", "A disappearance is being blamed on the swamp, maybe rightly.", "The church and the bayou mystics are headed for open conflict."], "connections": ["House Merrow", "Darkfen River"], "arcSeam": null, "legendary": null}, {"name": "Rotting Swamp", "region": "II — The Redgrass", "type": "natural feature", "era": "Natural", "terrain": "a fetid, reed-choked mire-pocket in the northern grass", "holder": "unclaimed (shunned)", "now": "A stinking pocket of black standing water where the north grass sags low — not the great bayou, just a bad patch that swallows stock, and the drovers steer wide of it.", "threads": ["A channel everyone trusted has gone wrong, and boats aren't coming back.", "A settlement sits somewhere deep in the swamp that outsiders never manage to find.", "Something big is moving in the deep water, and the gators are fleeing it."], "connections": ["The Graywater Drownlord", "Snakefen River"], "arcSeam": null, "legendary": "The Graywater Drownlord hunts the deep channels — in fog, at the dark of the moon, drawn to blood in the water. Mistaken for a sunken log until it moves; it takes you under and you do not surface. It has fed down here a very long time, and the swamp always keeps one."}, {"name": "Darkfen River", "region": "VII — The Tideward", "type": "natural feature", "era": "Natural", "terrain": "a narrow black channel winding through the far-eastern coastlands", "holder": "the bayou mystics", "now": "A narrow black channel in the far-eastern coastlands, where the dead are said to walk its banks.", "threads": ["A mystic will guide you up the Darkfen — if you pass a test you won't see coming.", "Someone broke the mystics' ban and hasn't been seen since.", "The church at Beabrook wants the Darkfen rites stamped out."], "connections": ["Beabrook"], "arcSeam": "The bayou mystics keep an old water-magic that looks a great deal like the freely-given way — reciprocity with the swamp's living things, uncorrupted by the Houses. A rare, hidden thread to clean magic, and a people who never forgot the difference between a gift and a theft. (low.)", "legendary": null}, {"name": "Toadfen Mire", "region": "VI — The Greenreach", "type": "natural feature", "era": "Natural", "terrain": "a boggy fen in the eastern green country, loud with toad-song", "holder": "unclaimed (the uplanders shun it)", "now": "A dank fen where the toad-song never stops and the mud takes boots and the occasional traveler whole — the locals give it a wide berth and leave offerings at its edge.", "threads": ["A mystic needs a rare mire-herb and won't wade for it herself.", "Something is killing the toads, and the new silence is worse than the song.", "A body surfaced in the shallows that the mire should have kept."], "connections": [], "arcSeam": null, "legendary": null}, {"name": "Dreadwood Vale", "region": "VII — The Tideward", "type": "natural feature", "era": "Natural", "terrain": "a drowned forest-vale of grey dead trees in the far-eastern green country", "holder": "unclaimed (feared)", "now": "A vale of grey drowned trees in the far-eastern green country, shunned by the locals.", "threads": ["A way through the vale would save days of poling the long channels.", "Something nests in the dead canopy and drops on the unwary.", "A drowned village lies under the water, and its bell still rings on the current."], "connections": [], "arcSeam": null, "legendary": null}, {"name": "Ghoulmoor River", "region": "VII — The Tideward", "type": "natural feature", "era": "Natural", "terrain": "a slow black river thick with drowned-dead folklore, in the far east", "holder": "unclaimed", "now": "A slow black river in the far east, thick with drowned-dead folklore and the necromancers’ leavings.", "threads": ["Bodies along the banks won't stay buried.", "A ferryman knows exactly which nights to stay ashore.", "A family is haunted by a drowned kin who keeps coming home wet."], "connections": [], "arcSeam": null, "legendary": null}, {"name": "Blightmoor River", "region": "VI — The Greenreach", "type": "natural feature (blighted)", "era": "Contested", "terrain": "a river running wrong through the eastern reaches — bitter water, dead fish", "holder": "shunned", "now": "A river that runs wrong through the eastern green country — bitter water, dead fish, a smell that turns travelers back.", "threads": ["Fishing villages downstream are dying slowly and don't know why.", "A Press agent is tracing the poison upstream and needs an escort.", "The fish that do survive in it have come out wrong."], "connections": ["The Desolation of Hammesha"], "arcSeam": "Blightmoor carries a Desolation's poison out of the Redgrass and into the Drownlands — proof the atrocity has reach, flowing downstream to kill people who've never seen a dead-flat. Trace the bitter water far enough up and it ends at a working blood-house. (low.)", "legendary": null}, {"name": "Snakefen River", "region": "VI — The Greenreach", "type": "natural feature", "era": "Natural", "terrain": "a serpent-roped waterway winding through the eastern green country", "holder": "unclaimed (smugglers' road)", "now": "A serpent-roped river threading the eastern green country — smugglers and worse use its hidden channels.", "threads": ["A Redhand run went wrong in the deep channels and the cargo's still out there.", "A snake-handler will guide you, for a price and a promise.", "Something in the water isn't a snake, and it's been pacing the boats."], "connections": ["Rotting Swamp", "The Graywater Drownlord"], "arcSeam": null, "legendary": null}, {"name": "Dushmoor River", "region": "VI — The Greenreach", "type": "natural feature", "era": "Natural", "terrain": "a broad slow river winding through the eastern green country", "holder": "unclaimed", "now": "A wide, placid river threading the green eastern lowlands — local fishing boats, the odd barge, and no House with a real grip on its traffic.", "threads": ["A toll-war between river-bosses is choking the traffic.", "A Merrow collector is making his rounds, and debts are coming due.", "A boat went downriver loaded and never reached the sea."], "connections": ["House Merrow", "Sewich, City of the Deadly Sins"], "arcSeam": null, "legendary": null}, {"name": "Trystne River", "region": "IV — The Drownlands", "type": "natural feature", "era": "Natural", "terrain": "a quiet river with a soft name and a bloody history", "holder": "feuding bayou families", "now": "A gentle-looking river that has settled more scores than any court — feuding families line its banks, and the slow water has carried off a great many of their dead.", "threads": ["A forbidden romance between two feuding houses is about to reignite the war.", "The river gave a body back, and it names a killer.", "A wedding on the water is really an ambush."], "connections": [], "arcSeam": null, "legendary": null}, {"name": "The Sea of Ares", "region": "IV — The Drownlands", "type": "natural feature", "era": "Natural", "terrain": "a warm, shallow, island-dotted sea along the southern edge", "holder": "unclaimed", "now": "Where the bayou bleeds into warm shallows — gator-hunters, saurian-whalers, and smugglers work its mud-flats and islets, and a storm off the water can drown a coast town in an afternoon.", "threads": ["A saurian-whaling crew is nursing a grudge and a full hold.", "An island surfaces only at the lowest tides, and something's on it.", "Contraband is landing on the mud-flats by dark."], "connections": ["Lecot", "The Sea of Barbe"], "arcSeam": null, "legendary": null}, {"name": "The Sea of Barbe", "region": "IV — The Drownlands", "type": "natural feature", "era": "Natural", "terrain": "a deeper, rougher sea east along the southern coast", "holder": "unclaimed", "now": "East of the Ares and meaner — real ships work it and real wrecks line its reefs, and the line between trader, whaler, and pirate is thin as a reef-edge.", "threads": ["A wrecker crew is luring ships onto the reefs with false lights.", "A drowned cargo is worth a fortune to whoever can dive it.", "Storm season has come early and the harbors aren't ready."], "connections": ["The Sea of Ares"], "arcSeam": null, "legendary": null}, {"name": "The Peerless City of Rhynllo", "region": "VI — The Greenreach", "type": "settlement", "era": "Living", "terrain": "a grand rail-city, the lit and lawful jewel of the civilized east", "holder": "House Meridian", "now": "The frontier's proudest city — rail-connected, gas-lit, orderly, and convinced it has left the wild behind. Meridian built Rhynllo to prove the frontier could be civilized, and it works beautifully, so long as no one asks where the comfort comes from.", "threads": ["A society scandal has teeth that reach the rail-board.", "A Meridian official is skimming the land-grants.", "A country cousin who's seen the hinterland is asking rude questions in polite rooms."], "connections": ["House Meridian"], "arcSeam": "Rhynllo is the comfortable lie made into a city — the frontier's success story, lit and lawful, resting on exactly the same blood economy as the rawest boomtown, only better hidden behind civic pride. Nowhere is the complicity more total, or more invisible. Ambient, not a reveal node. (low.)", "legendary": null}, {"name": "Brefield, the City of Secrets", "region": "V — The Spine", "type": "settlement", "era": "Living", "terrain": "a prosperous city that buys and sells information", "holder": "free — Merrow and the Press both keep quiet offices", "now": "Where the east's secrets change hands — a city of brokers, spies, and discreet houses, where everyone knows something and nothing is given away. Merrow keeps ledgers here; so, more carefully, does the Press.", "threads": ["A broker is selling a secret that could topple a House.", "A blackmail ring has overreached and is panicking.", "A Press cell is using the secret-trade as cover for something larger."], "connections": ["House Merrow", "The Press"], "arcSeam": "Brefield trades in secrets, which means someone there is unknowingly sitting on a piece of THE secret — and the Press works the city hardest for exactly that reason. A place to buy a thread of the truth, if you can afford it and survive the transaction. (medium.)", "legendary": null}, {"name": "Elysian Jungle", "region": "VI — The Greenreach", "type": "natural feature", "era": "Natural", "terrain": "a vast, beautiful, lethal tropical jungle", "holder": "unclaimed", "now": "The green heart of the east — a jungle so lovely the first explorers named it paradise, and so deadly most never came back out of it. Meridian dreams of a rail straight through. The jungle has other ideas.", "threads": ["A Meridian survey crew is lost somewhere under the canopy.", "A lost city is rumored beneath the growth.", "Something has started hunting the hunters who hunt it."], "connections": [], "arcSeam": null, "legendary": null}, {"name": "Kobold Jungle", "region": "VI — The Greenreach", "type": "natural feature", "era": "Natural", "terrain": "a dense jungle the frontier blames on its 'kobolds'", "holder": "the saurian-folk", "now": "Named for the small, quick, scaled folk the frontier calls kobolds and treats as vermin — and who are far cleverer than anyone will admit. They have held this jungle against every intrusion, and they remember each one by name.", "threads": ["A Meridian survey massacred a warren and started a war it doesn't know it's losing.", "A captured 'kobold' speaks — in sentences.", "A few bold traders have opened an honest exchange with the jungle-folk, and it's working."], "connections": [], "arcSeam": "The 'kobolds' are thinking saurian-folk — small, hidden, dismissed as vermin, but a people, and arguably Kinline kin. The frontier's contempt is the same machinery that erased the scaled folk: call a thinking people vermin and nobody asks what you do to them. An early, deniable brush with the truth that some 'beasts' are people. (medium.)", "legendary": null}, {"name": "Hato Jungle", "region": "VI — The Greenreach", "type": "natural feature", "era": "Natural", "terrain": "a steaming lowland jungle of brown rivers and swallowed ruins", "holder": "unclaimed", "now": "A tangled lowland jungle laced with slow brown rivers and the overgrown stones of something far older — hot, close, and generous with fever.", "threads": ["An old-world ruin lies half-swallowed in the deep green.", "A fever is felling whole expeditions.", "A river-route through exists, if you can find a local who'll share it."], "connections": [], "arcSeam": null, "legendary": null}, {"name": "Para Jungle", "region": "V — The Spine", "type": "natural feature", "era": "Natural", "terrain": "a cool, cloud-wreathed upland jungle on the eastern slopes", "holder": "unclaimed", "now": "A higher, cooler jungle between the lowland green and the eastern hills — mist-wrapped and strange, full of plants and beasts found nowhere else on the frontier.", "threads": ["A rare upland bloom is worth a fortune to the right buyer.", "A plateau rises out of the cloud that no one has climbed.", "Something descends from the heights to hunt, then vanishes back up."], "connections": [], "arcSeam": null, "legendary": null}, {"name": "Penca Forest", "region": "VI — The Greenreach", "type": "natural feature", "era": "Natural", "terrain": "a temperate forest where the piedmont gives way to the jungle", "holder": "free / Sabine", "now": "The northern edge of the green country, where honest temperate woods surrender to the tropics — good timber, good hunting, and the last familiar forest before the green turns strange.", "threads": ["A logging war is heating up at the forest's edge.", "A hunter's lodge here has a very dark reputation.", "Something has wandered up out of the jungle and into the familiar woods."], "connections": [], "arcSeam": null, "legendary": null}, {"name": "Paratra", "region": "VI — The Greenreach", "type": "settlement", "era": "Living", "terrain": "a bustling rail-and-plantation junction", "holder": "House Meridian & House Sabine", "now": "A prosperous junction where Meridian's rail meets Sabine's eastern ranch-country — stockyards, warehouses, and the comfortable bustle of a frontier gone respectable.", "threads": ["A labor dispute on the Sabine spread is spreading to town.", "A rail-yard theft ring has an inside man.", "A planter's son has gone missing into the jungle's edge."], "connections": ["House Meridian", "House Sabine"], "arcSeam": null, "legendary": null}, {"name": "Olingul", "region": "VI — The Greenreach", "type": "settlement", "era": "Living", "terrain": "a humid coastal port where the jungle meets the sea", "holder": "free — House Merrow counts the crates", "now": "The Greenreach's main eastern port — jungle hardwood, strange cargo, and stranger passengers moving out to the sea-lanes, with a Merrow factor tallying every crate that crosses the dock.", "threads": ["A smuggling ring runs jungle-goods past the Merrow tally.", "A ship in from the deep sea has a hold no one will open.", "A storm season is bearing down on an unready harbor."], "connections": ["House Merrow"], "arcSeam": null, "legendary": "The coast off Olingul is Stormcrown country — the colossal sky-beast rides the sea-gales and nests on an unclimbable sea-stack. To meet it you go out onto the cliffs or the water in the teeth of the storm. The white whale of every Mustang rider."}, {"name": "The Temple of Broken Worlds", "region": "VI — The Greenreach", "type": "ruin", "era": "Old-world", "terrain": "a jungle-wrapped temple, the eastern seat of the cult", "holder": "the Broken Worlds cult", "now": "The third and easternmost seat of the Broken Worlds faith — a temple strangling in jungle growth where the eastern branch keeps rites subtly different from the Shrine and the Pantheon. Here, some do not mourn the breaking. Some welcome it.", "threads": ["A faction is preparing to 'help the sky' in some way no one will explain.", "A relic here is said to call the next fall.", "A schism with the mountain seats is turning to open violence."], "connections": ["The Shrine of Broken Worlds", "The Pantheon of Broken Worlds"], "arcSeam": "The eastern Broken Worlds seat, where the faction that WELCOMES what the sky delivers is strongest. If anyone is actively working WITH the restocking — helping keep the farm stocked — it is the keepers here. The cosmic-tier thread with a sinister tilt: not just watchers of the machine, but possibly its hands. (medium.)", "legendary": null}, {"name": "The Fortress of Saamsinima the Witch", "region": "V — The Spine", "type": "ruin", "era": "Old-world", "terrain": "the jungle-shrouded ruin of a dread sorceress's seat", "holder": "the dead", "now": "The stronghold of Saamsinima, the Witch whose name still scars the eastern reaches — now a ruin wrapped in green, shunned by every traveler who knows the tale.", "threads": ["A relic of the Witch is rumored in the cold chamber.", "A cult is trying to revive her art.", "The jungle grows over everything here but the one room."], "connections": ["The Desolation of Saamsuma"], "arcSeam": "Saamsinima was a defiler, and this fortress is the other end of the Desolation of Saamsuma's scar — her workshop. A party that connects the jungle ruin to the distant dead-flat learns that 'the Witch' was a blood-worker, and that the art had freelancers long before it had Houses. (medium.)", "legendary": null}, {"name": "The Sepulcher of Ghastly Souls", "region": "V — The Spine", "type": "dungeon", "era": "Old-world", "terrain": "a vast old-world necropolis on the jungle's eastern edge", "holder": "the dead", "now": "A whole city of tombs where the old world buried its great dead with honors and horrors both. The jungle is swallowing it, and the dead here do not all keep still.", "threads": ["Grave-robbers are after old-world funerary wealth.", "Something tends the tombs, and resents visitors.", "A crypt was opened recently — from the inside."], "connections": ["Bargar, the City of Necromancy"], "arcSeam": "A necropolis on the approaches to the Tideward's necromancy-country; the restless dead here are a thread toward the liches' domain and the part of the old world that never finished dying. (low.)", "legendary": null}, {"name": "The Sanctum of Inar the Dire", "region": "VII — The Tideward", "type": "ruin", "era": "Old-world", "terrain": "the sealed tower-sanctum of a dreaded old-world mage", "holder": "the dead", "now": "Inar the Dire was a name to frighten children before the Tearfall, and his sanctum still stands — intact, sealed, high in the green country. What he studied, no living soul knows, and the Treaty-kept would prefer the seal stayed unbroken.", "threads": ["Someone is trying to break the seal.", "Inar's library is rumored whole inside.", "A warning is carved over the door in a script no one reads anymore."], "connections": ["The Forbidden City of Pahyrst"], "arcSeam": "Another old-world mage whose sealed sanctum may hold before-time knowledge — like Pahyrst, like the Maford archives. The recurring pattern of sealed and erased old-world knowledge is itself the clue: the past was buried on purpose. (low.)", "legendary": null}, {"name": "Maford Castle", "region": "VI — The Greenreach", "type": "stronghold (ruin)", "era": "Old-world", "terrain": "the martial seat of the old Maford line, on the piedmont's edge", "holder": "the dead — a claimant has moved in", "now": "The greatest seat of the Maford house — a true castle, far better preserved than the Tower or the Garden City, standing where the piedmont meets the green. A would-be heir has taken up residence and is trying to make it live again.", "threads": ["The heir is hunting proof of the Maford bloodline.", "A rival claimant has appeared with a better story.", "The castle's deep archive is intact, and untouched."], "connections": ["Maford Tower", "The Garden City of Maford"], "arcSeam": "The best-preserved Maford seat — its deep archive likely holds the before-time records the Tower and Garden City only hinted at. The most accessible route to an old-world house's uncensored memory of the world before the harvest. (low-medium.)", "legendary": null}, {"name": "Naledzadd, the City of Bridges", "region": "V — The Spine", "type": "settlement", "era": "Living (old-world)", "terrain": "a city built across soaring old-world bridges over a jungle gorge", "holder": "free — Meridian covets it", "now": "The eastern sister of Mebury — a city strung across the impossible bridges the old world flung over a vast jungle gorge. Meridian wants the crossing badly; the city guards its spans and its independence just as hard.", "threads": ["Meridian is pressing to 'modernize' the bridges, which everyone reads correctly.", "A main span is failing and the old craft to fix it is lost.", "A route runs beneath the bridges, down through the gorge itself."], "connections": ["Mebury, the City of Bridges"], "arcSeam": null, "legendary": null}, {"name": "Waham, City of the Clockwork", "region": "VI — The Greenreach", "type": "ruin", "era": "Old-world", "terrain": "the eastern Clockwork city, its finer machines stilled", "holder": "free folk among the ruins", "now": "The sister to Batun — an old-world city of automata that froze when the Weave broke, now half-inhabited and half-scavenged. The eastern works were finer, and a few of them, impossibly, still twitch.", "threads": ["A master automaton is rumored intact in the sealed district.", "Rival scavenger guilds are at war over the best mechanisms.", "A Meridian buyer is quietly acquiring every working piece."], "connections": ["Batun, City of the Clockwork"], "arcSeam": "The Clockwork cities measure what the Tearfall cost. Waham's finer works may hold a clue to how the old world's artifice ran — and what it was replaced by. (low.)", "legendary": null}, {"name": "Cheabury", "region": "VI — The Greenreach", "type": "settlement", "era": "Living", "terrain": "a comfortable piedmont market town on the rail", "holder": "House Meridian", "now": "A pleasant, prosperous market town that has quietly forgotten the frontier is still out there — clean streets, full shops, and a studied disinterest in anything unpleasant.", "threads": ["A scandal the town very much wants buried.", "An outsider is stirring up questions no one wants asked.", "A Sabine contract dispute is souring the market."], "connections": ["House Meridian"], "arcSeam": null, "legendary": null}, {"name": "Soudale", "region": "VI — The Greenreach", "type": "settlement", "era": "Living", "terrain": "a Sabine ranch-town on the cleared eastern grass", "holder": "House Sabine", "now": "Sabine's eastern anchor — cattle country where the jungle's been cut back for grazing, and the ranch runs the town the way Sabine runs everything.", "threads": ["The jungle is taking the cleared land back, faster each season.", "A prize herd has been struck by something out of the green.", "A ranch-hands' union is quietly forming."], "connections": ["House Sabine"], "arcSeam": null, "legendary": null}, {"name": "Beagga Hills", "region": "VI — The Greenreach", "type": "natural feature", "era": "Natural", "terrain": "rolling piedmont hills buffering the ranches from the jungle", "holder": "free / Sabine", "now": "Pleasant hill country where cleared ranch-land meets green chaos — orchards and holdings along an uneasy border that moves a little whenever anyone stops watching it.", "threads": ["A hill-holding is squeezed between the jungle and Sabine's fences.", "A hidden valley shelters something, or someone.", "Raiders are using the hills to strike the ranches below."], "connections": [], "arcSeam": null, "legendary": null}, {"name": "Egror", "region": "VI — The Greenreach", "type": "settlement", "era": "Living", "terrain": "a raw railhead town at the eastern end of the line", "holder": "House Meridian", "now": "Where Meridian's eastern rail currently stops — a raw, booming, lawless railhead, the civilized corridor's ragged edge, as wild now as the west used to be.", "threads": ["A land-grab is tearing the railhead apart.", "Meridian and the locals are at odds over the line's next route.", "The jungle is pushing back hard at the survey crews."], "connections": ["House Meridian"], "arcSeam": null, "legendary": null}, {"name": "Cahyrst, the Ledger", "region": "VII — The Tideward", "type": "settlement", "era": "Living", "terrain": "a cold grey counting-house city of locked rooms on the northern coast", "holder": "House Merrow (seat)", "now": "The Ledger — House Merrow's seat, a city of grey stone and sealed vaults where the frontier's oldest money sleeps and the oldest debts are never, ever forgotten. Nothing is lit here that doesn't need to be; nothing is said that isn't counted.", "threads": ["A Merrow auditor has found a discrepancy in the oldest books and cannot un-see it.", "A family is being held to a debt three centuries in arrears.", "The deepest vault opens only to three Wardens' keys turned together."], "connections": ["House Merrow", "Inggrove", "Brefield, the City of Secrets"], "arcSeam": "THE DOCUMENTED CRIME. Merrow's Ledger recorded everything, back to the founding — every debt and transaction, including the ones that financed the first harvest and bought the killing of Kas. Here the truth is neither testimony nor ruins; it is AUDITED, in double-entry, in the deep archive. Merrow is the apex of the Table precisely because money has no dead-flats — the scar always lands on someone else's map. Kill the king at the top and you missed Merrow. The eastern bookend of the entire reveal: the atrocity in the accounts. (HIGHEST.)", "legendary": null}, {"name": "Inggrove", "region": "VII — The Tideward", "type": "settlement", "era": "Living", "terrain": "a fog-wrapped island of printers and exiles off the cold coast", "holder": "the Press", "now": "A hard island of rock and fog where the Press keeps its presses and its people, out past Merrow's easy reach, printing what the mainland would hang them for. It smells of ink and lye and the sea.", "threads": ["A courier is in from the mainland with a document worth dying for.", "A Merrow agent has finally found the island.", "A printer must decide whether a given truth is worth the lives it will cost to print it."], "connections": ["The Press", "Cahyrst, the Ledger", "Brefield, the City of Secrets"], "arcSeam": "THE WEAPON'S FORGE. If Cahyrst is where the crime is hidden in the record, Inggrove is where it would be PUBLISHED. The whole endgame lives in the water between them: steal the proof from the Ledger, carry it to the presses, and loose the one weapon the Houses cannot kill — the truth, printed and scattered past recall. The party's possible role is that courier. (HIGHEST.)", "legendary": null}, {"name": "Bargar, the City of Necromancy", "region": "VI — The Greenreach", "type": "settlement", "era": "Living (old-world)", "terrain": "a grey city where the dead work the docks and the counting-houses", "holder": "the liches", "now": "The east's open secret — a city where necromancy isn't hidden but industrial, the dead laboring on the wharves, ruled by powers that haven't drawn breath in centuries. The living come to trade, carefully, and leave before dark.", "threads": ["A merchant paid for a working and can't afford the second price.", "A lich's agent is recruiting the living for a task the dead can't perform.", "A necromancer's apprentice wants out, and knows too much to simply leave."], "connections": ["The Fortress of the Lich Tyrant", "The Dread Pit of Zeiram the Lich", "Penmost, City of the Raven Queen"], "arcSeam": "Bargar's liches survived the Weave-break (undeath needs no Weave) and remember the old world firsthand — the eastern undying, cousins to Strahd in endurance if not in blood. Some are scholars who KEPT the records the Houses burned; some are rivals to the Table; some simply remember what the scaled folk were. A party that bargains with the dead can buy old truth, at prices the living come to regret. (HIGH.)", "legendary": null}, {"name": "The Dread Pit of Zeiram the Lich", "region": "VII — The Tideward", "type": "dungeon", "era": "Old-world", "terrain": "a bottomless shaft-complex sunk into the coast's bones", "holder": "Zeiram the Lich", "now": "The lair of Zeiram, oldest and most withdrawn of the eastern liches, who has hoarded the old world's lore down here longer than the Houses have existed. He does not leave. He does not forget. He waits.", "threads": ["Zeiram will trade knowledge for a service only the living can render.", "A rival lich covets his hoard.", "A scholar went down to ask one question and never came up."], "connections": ["Bargar, the City of Necromancy", "The Fortress of the Lich Tyrant"], "arcSeam": "Zeiram may be the single greatest repository of before-time knowledge still cogent — he remembers the world before the Vanishing, kept records while everyone else was erasing them, and could hold the whole truth from Strahd to the Flood. The deepest library in the setting, guarded by a mind that has had centuries to decide its price. (HIGH.)", "legendary": null}, {"name": "The Fortress of the Lich Tyrant", "region": "VII — The Tideward", "type": "stronghold", "era": "Old-world", "terrain": "a black fortress from which a dead king rules the living coast", "holder": "the Lich Tyrant", "now": "Not all the eastern dead are scholars. The Lich Tyrant rules a stretch of cold coast the way a living king does — armies, taxes, terror — except he cannot die and his soldiers never tire. The Houses tolerate him because he is useful, and far away.", "threads": ["The Tyrant demands a tribute the coast towns cannot meet.", "A rebellion needs outside steel and someone mad enough to bring it.", "The Tyrant's phylactery is rumored, and hunted, and bait."], "connections": ["Bargar, the City of Necromancy", "The Dread Pit of Zeiram the Lich"], "arcSeam": "The Lich Tyrant is a power the Table tolerates and quietly deals with — proof the Houses traffic with the undying when it suits them. His court is a place to learn the Table's relationships from the outside, through an enemy of no one and an ally of whoever pays. (medium.)", "legendary": null}, {"name": "Penmost, City of the Raven Queen", "region": "VII — The Tideward", "type": "settlement", "era": "Living (old-world)", "terrain": "a beautiful city of mourning on the easternmost shore", "holder": "the Raven Queen", "now": "On the last shore before the open sea stands a sorrowful, lovely city where the dead are honored above the living, ruled beyond any mortal span by a veiled sovereign the people call the Raven Queen. Here death is not feared but kept, and the Queen keeps it.", "threads": ["The Queen has summoned a living party to an audience none survive refusing.", "A funeral in the high city is, on closer look, a coronation.", "The Queen's ravens carry messages far out to sea, to someone, somewhere."], "connections": ["Bargar, the City of Necromancy", "The Temple of Shattered Souls"], "arcSeam": "The eastern death-sovereign — undying, veiled, old enough to remember. Whether she's a lich, a god-remnant, or something the Tearfall made, she keeps the dead AND their secrets, and may know what the Empress knows while wanting very different things with it. A wildcard power at the map's far edge, neither Table nor foe of it until she chooses. (medium-HIGH.)", "legendary": null}, {"name": "Pabrycg, City of the Dark Crystal", "region": "VII — The Tideward", "type": "settlement", "era": "Living", "terrain": "a city built around a colossal black crystal that drinks the light", "holder": "free — bound tight to House Merrow", "now": "Built around, and partly inside, a single colossal black crystal that no one raised and no one can break — it drinks lamplight and hums when dram is near. In its shadow the east's dram is cut and graded, and the work pays well enough that nobody asks what the crystal is.", "threads": ["The crystal is, measurably, growing.", "A master cutter has gone strange from too long in its shadow.", "Merrow has a standing contract for 'crystal-touched' dram at triple the going rate."], "connections": ["House Merrow", "Cahyrst, the Ledger"], "arcSeam": "Pabrycg is where the east's dram is refined and graded — the last link before the market — and the Dark Crystal does something to dram that no one understands and Merrow sells dear. Optional deep thread: the crystal may be a Tearfall-relic, or a thing that likes what dram is made of and is slowly waking to the taste. (medium.)", "legendary": null}, {"name": "Axdale, the Throne of Olithlul", "region": "VII — The Tideward", "type": "ruin", "era": "Old-world", "terrain": "a drowned throne-city at the tide-line, served by the not-quite-right", "holder": "Olithlul (a deep-sea power)", "now": "The coast folk don't say the name Olithlul above a whisper. Its throne-city half-stands and half-drowns at the tide-line, and the fisherfolk who serve it are quiet, wet-eyed, and not quite right. Something old rules from the deep water — here before the Tearfall, and patient for after.", "threads": ["The tribute the coast owes Olithlul is overdue.", "A fisher-cult of the deep is expanding inland.", "The whole coast has begun to share the same dream."], "connections": ["Lost City (East)"], "arcSeam": "Olithlul is a deep-sea power the Tearfall never touched — a cosmic-horror thread at the map's edge, older than the human story and indifferent to the Houses' crimes. It widens the world past the central atrocity: not everything ancient is about the harvest. Some of it is simply hungry, and patient, and does not care who you are. (medium.)", "legendary": null}, {"name": "The Temple of Shattered Souls", "region": "VII — The Tideward", "type": "ruin", "era": "Old-world", "terrain": "a storm-battered headland temple where souls were broken and kept", "holder": "the dead (and pilgrims among the liches)", "now": "On a storm-raked headland stands a temple where the old world did something to the soul itself — shattered them, and kept the pieces, for reasons the surviving rites only hint at. The liches of Bargar come here on pilgrimage.", "threads": ["A soul-shard still remembers being a person, and wants to be whole.", "A cult is trying to reassemble a shattered soul into something new.", "A lich seeks a specific fragment the temple has held for an age."], "connections": ["Penmost, City of the Raven Queen", "The Cloister of Pain"], "arcSeam": "Old-world soul-magic, bound to the liches and the Raven Queen — a thread toward what the Tearfall did to the soul, and what the undying really are underneath. (medium.)", "legendary": null}, {"name": "The Cloister of Pain", "region": "VII — The Tideward", "type": "ruin", "era": "Old-world", "terrain": "a sea-cliff cloister of an order that worshipped suffering", "holder": "the dead (a cult revives it)", "now": "A grim cloister on a sea-cliff where an old-world order held that pain was holy, and practiced accordingly. The order is gone; the instruments remain, and so, the coast folk say, does the appetite in the stones.", "threads": ["A relic of the order surfaces on the market.", "A modern cult is reviving the old practice.", "A prisoner was left here centuries ago and is, somehow, not dead."], "connections": ["The Temple of Shattered Souls"], "arcSeam": "An order that sanctified pain, in a world where pain IS power. A quiet thread toward the possibility that the old world already understood what the Houses later industrialized — that agony has a use — long before Kas made a trade of it. (low-medium.)", "legendary": null}, {"name": "The Vale of Omens", "region": "VII — The Tideward", "type": "settlement", "era": "Living", "terrain": "a cliff-vale of oracle-houses above the open eastern sea", "holder": "free — the oracle-houses", "now": "The eastern echo of Plebury — a vale of cliff-perched oracle-houses where the Tideward comes to read the future in the sea and the sky. The readers here face the open horizon, and watch for what falls out of it.", "threads": ["An oracle has seen the next fall and won't come down from her perch.", "Rival oracle-houses are feuding over a single dire reading.", "Someone wants a prophecy about the Houses un-spoken, permanently."], "connections": ["Plebury, the City of Omens"], "arcSeam": "Like Plebury, the Vale's true oracles know the craters aren't random — and facing the open sea and open sky at the map's eastern limit, they may see what's coming before anyone else. A cosmic-tier thread toward the restocking, placed where the horizon is widest. (medium.)", "legendary": null}, {"name": "Beyfalls", "region": "VII — The Tideward", "type": "settlement", "era": "Living", "terrain": "a cold northern fishing-and-whaling port", "holder": "free — House Merrow holds the notes", "now": "A grey, hardy port of fisherfolk and sea-saurian whalers on the frontier's cold northeastern edge, where the season is short and the sea takes its tithe in men every year.", "threads": ["A whaling crew is in too deep to Merrow.", "A great beast has been sighted offshore, and the bounty is madness.", "A ship is overdue past all hope, and the widow won't believe it."], "connections": ["House Merrow"], "arcSeam": null, "legendary": null}, {"name": "Gawold", "region": "VII — The Tideward", "type": "settlement", "era": "Living", "terrain": "a busy warm-water trade port on the southeastern coast", "holder": "free — House Merrow counts the docks", "now": "A busy warm-water port where the Greenreach's goods meet the eastern sea-lanes — Merrow money, mixed crowds, and the full menu of portside sins.", "threads": ["A smuggling ring has outgrown its protection.", "A ship has come in from beyond the known lanes with a strange manifest.", "A dockside murder has a motive no one can place."], "connections": ["House Merrow", "Olingul"], "arcSeam": null, "legendary": null}, {"name": "Tadun", "region": "VII — The Tideward", "type": "settlement", "era": "Living", "terrain": "a fortified harbor-town on the archipelago's main isle", "holder": "free (island council)", "now": "The chief town of the eastern islands — a fortified harbor that rules the archipelago's trade and its piracy both, independent of the mainland Houses and loudly proud of it.", "threads": ["An island succession dispute is splitting the council.", "A pirate fleet is gathering for something big.", "Merrow is making a quiet, generous offer for the harbor."], "connections": ["The Sea of Pearls"], "arcSeam": null, "legendary": null}, {"name": "Llano", "region": "VII — The Tideward", "type": "settlement", "era": "Living", "terrain": "a remote island town at the edge of the charted sea", "holder": "free", "now": "One of the last charted places before the open eastern sea — a small, salt-bitten island town of fishers, exiles, and people with good reasons to be unreachable.", "threads": ["A castaway washed up with an impossible story.", "An island has appeared on no chart, due east.", "A ship's crew is back, and won't say where they've been."], "connections": [], "arcSeam": null, "legendary": null}, {"name": "Ilanwrtyw", "region": "VII — The Tideward", "type": "settlement", "era": "Living", "terrain": "a mist-bound coastal town of old blood and older grudges", "holder": "free (old families)", "now": "A cold coastal town where the families go back to before the Houses and the grudges nearly as far — proud, insular, and slow to trust anyone whose grandfather they didn't personally know.", "threads": ["A blood-feud is reigniting over an old slight.", "An outsider arrives wearing an old family's face.", "A fresh wreck has reopened a buried inheritance dispute."], "connections": [], "arcSeam": null, "legendary": null}, {"name": "The Sea of Wrecks", "region": "VII — The Tideward", "type": "natural feature", "era": "Natural", "terrain": "a cold, reef-choked graveyard of ships", "holder": "unclaimed", "now": "A stretch of cold sea where the reefs and the fogs and the wreckers have sunk more ships than anyone has counted — a salvager's dream laid over a sailor's nightmare.", "threads": ["A famous wreck with a famous cargo is finally within reach.", "A wrecker crew works the fogs with false lights.", "A ghost-ship lures salvagers onto the rocks that killed it."], "connections": ["The Sea of Pearls"], "arcSeam": null, "legendary": null}, {"name": "The Sea of Pearls", "region": "VII — The Tideward", "type": "natural feature", "era": "Natural", "terrain": "a warm southeastern sea of pearl-beds and pirates", "holder": "unclaimed", "now": "The warm, bright sea south of the archipelago, famous for its pearl-beds and infamous for the pirates who tax the divers who work them. Beautiful, and worth killing over.", "threads": ["A newfound pearl-bed is about to start a small war.", "A pirate-king runs a protection racket on every diver.", "A diver has surfaced with something that is not a pearl and will not say where."], "connections": ["The Sea of Wrecks"], "arcSeam": null, "legendary": null}, {"name": "The Sea of Anien", "region": "VII — The Tideward", "type": "natural feature", "era": "Natural", "terrain": "the main cold grey sea between the coast and the isles", "holder": "unclaimed", "now": "The grey heart of the eastern waters, crossed by every ship that trades the Tideward, ruled by weather and by the Raven Queen's ravens — which are seen far out over the water where no bird has any business being.", "threads": ["A crossing must be made in weather that's turning murderous.", "A derelict is found adrift, intact and crewless.", "Ravens have begun following a particular ship."], "connections": ["Penmost, City of the Raven Queen"], "arcSeam": null, "legendary": null}, {"name": "Tunca Jungle", "region": "VII — The Tideward", "type": "natural feature", "era": "Natural", "terrain": "a steaming island jungle at the archipelago's southern end", "holder": "unclaimed", "now": "A hot, dense island jungle far out in the warm sea — the eastern isles' wild green heart, where the pirates hide, the castaways die, and the growth keeps secrets the sea never learned.", "threads": ["A pirate cache is buried somewhere in the green.", "A lost crew has gone feral in the interior.", "The jungle has nearly eaten a ruin that shouldn't be on an island at all."], "connections": [], "arcSeam": null, "legendary": null}, {"name": "Lost City (East)", "region": "VII — The Tideward", "type": "ruin", "era": "Old-world", "terrain": "a drowned-and-risen city, intact and nameless, on a far eastern shore", "holder": "the dead", "now": "One of two Lost Cities on the frontier — this one risen from the sea on some old upheaval onto a remote shore, intact and empty and nameless, its people and its name both gone together.", "threads": ["No one knows why it rose, or when, or whether it will sink again.", "Its halls are intact, and that is somehow worse than ruin.", "A rival expedition has already made landfall."], "connections": ["Axdale, the Throne of Olithlul"], "arcSeam": null, "legendary": null}, {"name": "The ruins of Sacot Castle", "region": "VII — The Tideward", "type": "ruin", "era": "Old-world", "terrain": "a sea-cliff castle half-fallen into the tide", "holder": "the dead", "now": "A castle the cliff gave up to the sea — half its halls underwater now, the rest a roost for seabirds and worse. A landmark for sailors and a grave for the salvagers who dive its drowned floors.", "threads": ["A vault sits below the waterline, reachable only at the lowest tide.", "A wrecker crew has made the ruin a base.", "A light shows in the one standing tower on certain nights."], "connections": [], "arcSeam": null, "legendary": null}, {"name": "Stefield Castle", "region": "VII — The Tideward", "type": "stronghold", "era": "Living (old-world)", "terrain": "a coastal hold guarding the road between the green country and the cold coast", "holder": "a free lord — House Merrow circling", "now": "A manned castle on the border between the Greenreach and the Tideward, holding the eastern road and taxing it hard. Whoever holds Stefield holds the gate to the whole cold coast.", "threads": ["A succession crisis has the garrison choosing sides.", "Merrow has made the holder an offer dressed as a rescue.", "A caravan has been refused passage and is looking for another way through."], "connections": ["House Merrow"], "arcSeam": null, "legendary": null}, {"name": "The River of Towers", "region": "I — The Sunder Basin", "type": "natural feature", "era": "Natural", "terrain": "a river lined with the ruined watchtowers of a vanished order", "now": "A slow western river whose banks are studded with crumbling old-world towers nobody built in living memory.", "threads": ["One tower still shows a light, and the river-folk won't say whose."], "connections": [], "arcSeam": null, "legendary": null, "holder": "unclaimed"}, {"name": "Llanda Woods", "region": "I — The Sunder Basin", "type": "natural feature", "era": "Natural", "terrain": "a dry scrub-wood on the Basin's northern edge", "now": "Thin, thorny woods between the salt flats and the western peaks, good for hiding and little else.", "threads": ["A band of claim-jumpers uses the woods to ambush the Wahyrst road."], "connections": [], "arcSeam": null, "legendary": null, "holder": "free folk (locals work its edges)"}, {"name": "Beryl River", "region": "V — The Spine", "type": "natural featu
