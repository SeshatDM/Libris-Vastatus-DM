<script>window.SITE={"tier": "dm", "page": "lore", "public": [{"title": "The Fallow", "body": "An altered Old West where the sky delivers. Great beasts and sudden fortunes fall from the heavens in crater-strikes, and a hard, beautiful frontier has grown up to chase them. Magic runs on dram — a physical commodity, scarce and dear — and the great Houses that supply it hold the whole country in their hands. It is a golden age, lonesome and elegiac, with a knife somewhere under it."}, {"title": "Dram", "body": "The power that lights every town wall and arms every Warden. Blood freely given heals; that much any child on the frontier knows. Dram is spell-power made physical — earned, bought, and spent, never free. Spell slots do not come back with a night's sleep out here; dram is a currency you work for, and the Houses control the supply."}, {"title": "The Seven Regions", "body": "West to east, the frontier grows more settled and more civilized. I — the Sunder Basin (salt flats and crater country). II — the Redgrass (open cattle range). III — the Scald (mission country and volcanic desert). IV — the Drownlands (bayou and black channels). V — the Spine (the great cold mountains and the oldest ruins). VI — the Greenreach (piedmont giving way to deep jungle). VII — the Tideward (the eastern seaboard and old port cities)."}, {"title": "The Five Houses", "body": "The great families that run the frontier and meet as 'the Table.' Meridian, the railroad — 'the line is life.' Sabine, the cattle empire — 'we tend our own.' Radiant, the church — 'come to the wall, and be well.' Merrow, the bank — 'your word, kept.' Newcome, the crater-rush — 'first to the fire.' Their lords are titled Wardens."}, {"title": "The Outlanders", "body": "Those outside the Houses, by reputation (the truth earned in play): the Given (saints or fools who help for nothing); the Redhand (smugglers and fences who know everyone); the Ashers (feared zealots who hunt dram and destroy it); the Press (printers and mapmakers who insist the powers hide something); the Treaty-kept (the first peoples, who owe the newcomers nothing); the marshals (thin, honest, overworked law); and the sky-cults (prophets of the falling sky)."}, {"title": "Your Companion", "body": "Every rider on the frontier keeps a beast — classed by the role it performs, not its species. It rides with you, fights on its own initiative, and carries a med-kit that keeps you alive. See the Dino Classes page for the seven roles."}], "dm": [{"title": "The logline", "body": "A frontier that runs on a crime too big to confess and too vital to stop. Every House is one face of a single crime; together they are the Rockefeller sin — a trust that knew exactly what the business was and ran it anyway, because everyone who could have stopped it was already inside."}, {"title": "The truth about dram", "body": "Blood freely given heals. Blood torn from a living, terrified creature transmutes into the working — fire, lightning, wards. Agony is the phase change, and the keener the mind, the richer the yield. The miracles that light every town wall are made of torture, and the whole economy depends on no one connecting the fireball to the flensing table. Every combat spell in the world is a confession."}, {"title": "The fuel ladder", "body": "Quality tracks awareness; the Houses buy on two axes — quality and renewability. Scaled folk (the peak, now 'extinct' — the Vanishing) burned to nothing. Humans: near-peak quality and fast-breeding, the sustainable premium, skimmed quietly from the disappeared — clandestine, never industrial. Dinosaurs: the low-mid industrial base, restocked by the sky."}, {"title": "The Fall — the sky's shipment", "body": "What falls from the sky falls in a shell. Each carries two cargoes: living cargo (beasts, the thinking stock — Sabine's prize, fed to the mills) and dead cargo (ore and gems — Newcome's prize). Newcome and Sabine aren't rivals; they're a division of labor on one shipment. And a shipment has a sender — the deepest question in the arc."}, {"title": "House Leverage — the service is the weapon", "body": "Each House runs one service the frontier can't live without, and the service is the weapon. Meridian abandons the line (its black/abandoned rails are its body count). Sabine drives the stampede. Radiant makes converts 'give themselves wholly to the Light.' Merrow calls the paper. Newcome steers the sky — and is the keystone, the one House that provably cannot plead ignorance."}, {"title": "The lineage", "body": "Strahd → Kas → the Founding Families → the Scaled Folk → the Dinosaurs. The dram economy is vampirism, democratized and industrialized and turned on thinking beings for profit and light, by people who aren't even vampires and don't even need it to live. The BBEG is the system, not a body — and the party's only real weapon is the truth."}]};</script>
