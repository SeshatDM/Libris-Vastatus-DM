<script>window.SITE={"tier": "dm", "page": "npcs", "items": [{"name": "Chairman Cornelius Meridian", "house": "Meridian", "tier": "Head", "title": "Chairman", "region": "Frontier", "public": "Chairman of House Meridian, the railroad that binds the frontier together. A spare, courteous old man who receives the powerful in a private rail car and speaks of the line as life itself. The most important businessman on the frontier — and perhaps the most untouchable.", "dm_prose": "A spare, upright man past sixty who has never needed to raise his voice, because the voice was never the thing with teeth. He dresses like an undertaker and smiles like a man who has already read your contract, and he receives the frontier's powerful in a private rail car worth more than the towns it rolls through. He speaks of the line the way a preacher speaks of grace — the line is life — and he has made it true: a town on his rail breathes, a town off it does not, and he decides which over coffee. (What he will never say aloud: that he knows exactly what rides in the sealed cars behind the dram freight and has signed the manifests for forty years; that 'progress' is the word he launders it with; that the one sound he fears is a journalist's question he can't reroute.) Courteous to everyone and warm to no one; he will end your town with a routing decision and sleep like a child.", "dm_tag": {"runAs": "Noble/Spymaster hybrid; never fights — the car, the bulls, and the law are always three favors deep", "beast": "Ankylosaurus · Ironside (a kept monument; the line is his real mount)", "chainUp": "only the Table and the secret", "chainDown": "5 Division Superintendents"}}, {"name": "Doña Ysabel Sabine", "house": "Sabine", "tier": "Head", "title": "the Patrona", "region": "Frontier", "public": "The Patrona of House Sabine, matriarch of the greatest cattle empire on the frontier. A widow in black with a grandmother's warmth and a general's reach, who runs her herds and her people from a white hacienda with a working chapel. 'We tend our own,' she says — and means it.", "dm_prose": "A widow in black who buried two husbands and outgrew them both, she runs the largest herds on the frontier from a white hacienda with a chapel she actually prays in. She is grandmotherly and genuinely so — she'll feed you, ask after your mother, press a second helping — and that warmth is the most dangerous thing about her, because Ysabel Sabine tends everything she means to use. We tend our own, she says, and the question every guest should ask is when, exactly, they became hers. (Behind the rosary: she personally selects which of the clever stock get bred and which get sent down the line, and has never lost sleep; she reads people as bloodlines and is usually right; the softest voice at the Table belongs to its hardest head.) Cross her and the herd finds your fences; she will send flowers after.", "dm_tag": {"runAs": "Noble with a saint's manners and a general's reach; her stock-detectives do the violence", "beast": "Parasaurolophus · Trailboss (the herald — a crested matriarch's mount, voice like a hymn)", "chainUp": "only the Table", "chainDown": "3 Range Bosses"}}, {"name": "The Luminary, Ambrose Radiant", "house": "Radiant", "tier": "Head", "title": "the Luminary", "region": "Frontier", "public": "The Luminary of House Radiant, the most beloved man on the frontier. A tall, luminous healer of seventy who still lays hands at the wall himself each season. 'Come to the wall, and be well' — his missions take in the desperate and turn none away.", "dm_prose": "The most beloved man on the frontier, and he has earned every ounce of it. He still, at seventy, lays hands at the wall himself once a season so the faithful can say they saw him do it — a tall, luminous presence with a voice built for the back pew and eyes that hold yours a beat too long, warm as a lamp. Come to the wall, and be well, the missions promise, and they keep the promise, which is exactly what makes the rest invisible. (What the light hides: that he decides which desperate souls 'give themselves wholly to the Light' and are never seen again; that his missions are the cleanest laundry on the frontier, turning the disappeared into premium stock; that he has convinced himself it is mercy, and that conviction is sincere — which is the horror of him.) He will bless you with real feeling and mark your name the same morning.", "dm_tag": {"runAs": "Archpriest with genuine healing and a saint's reputation as armor", "beast": "Triceratops · Longhorn (the wall of the faith made flesh)", "chainUp": "only the Table", "chainDown": "4 Prelates of the Wall"}}, {"name": "First Clerk Pierpont Merrow", "house": "Merrow", "tier": "Head", "title": "First Clerk", "region": "Frontier", "public": "The First Clerk of House Merrow, the bank that holds the frontier's paper. A cold, immaculate, famously private man who keeps every promise and every debt. 'Your word, kept.'", "dm_prose": "The quietest man at the Table and the one the other four are afraid of. He keeps no ranch, rails no line, preaches nothing; he keeps the paper, and the paper keeps everyone. A cold, immaculate figure with ink-stained fingers he never bothers to clean, he speaks in the flat courtesy of a man reading a balance aloud, and he has never once made a threat — the paper does that for him, on a date already written. Your word, kept, runs the motto, and Merrow keeps everyone's word, in a vault, with the interest. (What the public pages don't show: that he holds debt on all four other Houses and could unmake any of them in a quarter; that his are the deepest archives of the founding crime, kept not from guilt but as collateral; that he is the apex of the Table precisely because he wants nothing a man could take.) He will foreclose on your life and call it arithmetic.", "dm_tag": {"runAs": "Noble-tier leverage with zero personal violence; the collectors and the law come when he decides", "beast": "Utahraptor · Sidewinder (a cold, precise predator kept leashed)", "chainUp": "only the Table — which quietly answers to him", "chainDown": "4 Factors"}}, {"name": "The Sky-Reader, Meyer Newcome", "house": "Newcome", "tier": "Head", "title": "the Sky-Reader", "region": "Frontier", "public": "The Sky-Reader of House Newcome, the youngest and newest fortune on the frontier, built on crater-strikes and uncanny luck. Charming, generous, and restless, with a flyer's sunburn — his people are always first to a fresh fall. 'First to the fire.'", "dm_prose": "The newest money on the frontier and, by the oldest reckoning, the worst of them — because he is the one who sees. A restless, sun-squinting man younger than the other heads, a flyer's burn across his face and a habit of watching the horizon mid-sentence, he built the House on a thing he calls luck and never explains: he knows where the sky will open before it does, and his people are first to every fire. First to the fire, the House says, and they always are. (What he reads and never reports: that every shell the sky drops carries living cargo as well as gold, and the living cargo goes to the mills while he pockets the gems; that he alone among the heads cannot plead ignorance, because he reads the whole manifest off the sky itself; that he does nothing to stop it and never has.) He is charming, generous, genuinely good company — and the keystone of the whole lie.", "dm_tag": {"runAs": "Noble/scout with uncanny foresight (always one step ahead of 'chance')", "beast": "Pteranodon · Mustang (the scout — he reads the sky from the air)", "chainUp": "only the Table", "chainDown": "3 Claim Bosses"}}, {"name": "Superintendent Harlan Cole", "house": "Meridian", "tier": "Region Lord", "title": "Division Superintendent — the Rhynllo Division", "region": "VII", "public": "Superintendent of House Meridian's Rhynllo Division — the great rail yard in the northeast, hub of the whole line. A blunt, grease-handed yard man who came up through the ranks; nothing moves on the eastern line without his say.", "dm_prose": "The senior Super on the line, and he wears it like a second coat — he runs the Rhynllo yard, origin of every manifest, and nothing moves on the eastern line without his chop. A broad, grease-under-the-nails man who came up through the yards and never lost the walk, he's blunt where the Chairman is smooth and solves problems with a quiet word to the bulls. (He knows more than a Super should about the sealed cars; he's decided not to think about it, and resents anyone who makes him.) Tell: he goes very still and very polite right before a problem 'gets handled.'", "dm_tag": {"runAs": "Veteran (yard foreman) with muscle on tap", "beast": "Euoplocephalus · Ironside (an armored yard-bull)", "chainUp": "Chairman Meridian", "chainDown": "Rhynllo rail bulls + eastern station agents"}}, {"name": "Superintendent Odette Vance", "house": "Meridian", "tier": "Region Lord", "title": "Division Superintendent — the Greenreach Division", "region": "VI", "public": "Superintendent of Meridian's Greenreach Division, the richest stretch of line. Polished and charming, all timetables and tailored coats — the face Meridian shows its investors.", "dm_prose": "The most profitable division and the most polished Super to match it — she runs the lush Greenreach corridor in tailored traveling clothes, all charm and timetables, the face Meridian shows investors. She expands by making a town need the spur before it notices the leash. (Ambitious for the Chairman's seat, she quietly keeps her own copy of his manifests — a knife for later.) Tell: the warmer and more accommodating she gets, the closer the leash is to closing.", "dm_tag": {"runAs": "Noble (negotiator), bulls a whistle away", "beast": "Parasaurolophus · Trailboss", "chainUp": "Chairman Meridian", "chainDown": "Greenreach bulls + station agents"}}, {"name": "Superintendent Isaiah Ford", "house": "Meridian", "tier": "Region Lord", "title": "Division Superintendent — the Redgrass Division", "region": "II", "public": "Superintendent of Meridian's Redgrass Division, where the rail crosses Sabine's open cattle range. A lean, tired diplomat who spends his days keeping an uneasy peace with the ranchers.", "dm_prose": "Runs the hardest stretch of all — the line crossing Sabine's open range, where every mile is a negotiation with a House that was here first. Lean, tired, and permanently braced, a diplomat by necessity who keeps a stock-detective's name in his pocket and a truce he renews monthly. (He hates the Redgrass, hates the Patrona's smiling men more, and would transfer tomorrow if the Chairman let him.) Tell: he checks the window for Sabine riders before he answers anything.", "dm_tag": {"runAs": "Veteran, badly over-leveraged", "beast": "Edmontosaurus · Ironside (plain, dependable)", "chainUp": "Chairman Meridian", "chainDown": "Redgrass bulls + station agents (few — Sabine country)"}}, {"name": "Superintendent Greta Holm", "house": "Meridian", "tier": "Region Lord", "title": "Division Superintendent — the Spine Division", "region": "V", "public": "Superintendent of Meridian's Spine Division, fighting to drive track through the great cold mountains. A profane, brilliant engineer who commands real loyalty from her crews.", "dm_prose": "The division that barely exists. Meridian has fought the Spine's mountains a decade and mostly lost, and she is the hard-bitten engineer-Super still trying to drive track through the oldest, coldest country on the frontier. Frostbitten, profane, and genuinely brilliant with a grade, she commands more real respect from her crews than any Super on the line. (She's seen things in the deep cuts the surveys don't mention, and has started keeping her own quiet notes — a thread straight into the oldest truth.) Tell: she stops swearing and gets precise when something's actually wrong.", "dm_tag": {"runAs": "Veteran (siege engineer)", "beast": "Ankylosaurus · Ironside (a cold-country plodder)", "chainUp": "Chairman Meridian", "chainDown": "the Spine's few bulls + end-of-track camps"}}, {"name": "Superintendent August Reed", "house": "Meridian", "tier": "Region Lord", "title": "Division Superintendent — the Western Division", "region": "I", "public": "Superintendent of Meridian's lonely Western Division, out where the rail peters into crater country. A quiet, watchful man who likes the distance and does brisk freight business with the camps.", "dm_prose": "Runs the lonely western stretch out to the Bargate full-stop, where the rail peters into Newcome's crater country. A quiet, watchful man who likes the emptiness and the distance from head office — and who does more freight business with Newcome's claim camps than the Chairman strictly knows. (He's the Super most willing to look the other way for a cut: the soft spot in Meridian's western flank.) Tell: he gets friendly and incurious right about when you'd want him paying attention.", "dm_tag": {"runAs": "Veteran (frontier fixer)", "beast": "Quetzalcoatlus · Mustang (a giant sky-ranger for the long empty line)", "chainUp": "Chairman Meridian", "chainDown": "western bulls + a thin chain of station agents"}}, {"name": "Chief Special Agent Boone Varley", "house": "Meridian", "tier": "House Law", "title": "Chief of the Rail Police", "region": "Frontier", "public": "The head of Meridian's railroad police — the Special Agents who keep order on every line. A granite-faced man who answers only to the Chairman.", "dm_prose": "Varley runs every bull on the frontier and runs them hard: strikes broken, obstructions cleared, troublesome passengers who somehow never reach their stop. (He has personally seen to it that certain cars are never opened, and has trained himself never to wonder why.)", "dm_tag": {"runAs": "Veteran (captain), +2 CR", "beast": "Triceratops · Longhorn (a wall that walks)", "chainUp": "Chairman Meridian", "chainDown": "yard crews + station agents"}}, {"name": "Yard Bull Mose Tiller", "house": "Meridian", "tier": "House Law", "title": "Rail Bull — Rhynllo yard", "region": "VII", "public": "A huge, slow-moving rail bull who works the Rhynllo yard. Keeps the hub orderly with a look and a billy.", "dm_prose": "Tiller is the yard's immovable object — he clears tramps, settles crews, and stands guard on the bonded freight without ever being told which cars matter.", "dm_tag": {"runAs": "Thug (tough)", "beast": "Ankylosaurus · Ironside", "chainUp": "Supt. Harlan Cole", "chainDown": "yard crews + station agents"}}, {"name": "Agent Prudence \"Pru\" Daxe", "house": "Meridian", "tier": "House Law", "title": "Rail Bull — eastern line", "region": "VII", "public": "A lean, quick railroad agent with a reputation for meanness. Rides the eastern line settling trouble.", "dm_prose": "Daxe is the bull they send when a problem needs to simply disappear between stations. Fast, cold, and effective; the crews are more afraid of her than of the Super.", "dm_tag": {"runAs": "Veteran (duelist)", "beast": "Deinonychus · Sidewinder", "chainUp": "Supt. Harlan Cole & Chief Varley", "chainDown": "yard crews + station agents"}}, {"name": "Agent Cyrus Flint", "house": "Meridian", "tier": "House Law", "title": "Rail Bull — Rhynllo approaches", "region": "VII", "public": "A barrel-chested bull who works the junctions outside Rhynllo. Breaks up what needs breaking.", "dm_prose": "Flint is a battering ram with a badge — he clears blocked spurs and 'persuades' holdout landowners along the right-of-way.", "dm_tag": {"runAs": "Thug", "beast": "Pachycephalosaurus · Ram", "chainUp": "Supt. Harlan Cole", "chainDown": "yard crews + station agents"}}, {"name": "Agent Lavinia Shaw", "house": "Meridian", "tier": "House Law", "title": "Rail Bull — Greenreach line", "region": "VI", "public": "A composed, well-dressed railroad agent on the Greenreach line — more negotiator than brawler, until she isn't.", "dm_prose": "Shaw is Vance's velvet glove and iron fist both: she arrives polite, and the people who stay difficult after she leaves tend not to stay at all. Keeps her own quiet files, same as her Super.", "dm_tag": {"runAs": "Veteran (assassin lean)", "beast": "Utahraptor · Sidewinder", "chainUp": "Supt. Odette Vance", "chainDown": "yard crews + station agents"}}, {"name": "\"Big\" Ezra Coyle", "house": "Meridian", "tier": "House Law", "title": "Rail Bull — Greenreach yards", "region": "VI", "public": "An enormous, genial rail bull everyone in the Greenreach likes — right up until the day the line needs him not to be liked.", "dm_prose": "Coyle trades on being the friendly giant; it makes the stampede of a cleared town land all the harder when it comes.", "dm_tag": {"runAs": "Thug (tough)", "beast": "Triceratops · Longhorn", "chainUp": "Supt. Odette Vance", "chainDown": "yard crews + station agents"}}, {"name": "Agent Tom Rourke", "house": "Meridian", "tier": "House Law", "title": "Rail Bull — Greenreach spurs", "region": "VI", "public": "A steady, by-the-book railroad agent who works the Greenreach spur towns.", "dm_prose": "Rourke is almost decent — he does the job without relish and tells himself the evictions are legal. The most turnable bull on the line, if a party ever needed one.", "dm_tag": {"runAs": "Veteran", "beast": "Euoplocephalus · Ironside", "chainUp": "Supt. Odette Vance", "chainDown": "yard crews + station agents"}}, {"name": "Agent Hettie Vane", "house": "Meridian", "tier": "House Law", "title": "Rail Bull — Redgrass line", "region": "II", "public": "A hard-bitten railroad agent who works the dangerous Redgrass stretch, where the line crosses Sabine range.", "dm_prose": "Vane spends half her time guarding track from 'accidents' and half keeping Meridian's temper when Sabine's riders lean on the line. Exhausted and mean about it.", "dm_tag": {"runAs": "Veteran", "beast": "Stygimoloch · Ram", "chainUp": "Supt. Isaiah Ford", "chainDown": "yard crews + station agents"}}, {"name": "\"Dust\" Calloway", "house": "Meridian", "tier": "House Law", "title": "Rail Bull — Redgrass crossings", "region": "II", "public": "A whip-thin, dust-caked bull who rides the lonely Redgrass crossings.", "dm_prose": "Calloway is the one Ford sends to meet Sabine's stock-detectives in the dark and keep the uneasy truce from breaking into open war.", "dm_tag": {"runAs": "Veteran", "beast": "Deinonychus · Sidewinder", "chainUp": "Supt. Isaiah Ford", "chainDown": "yard crews + station agents"}}, {"name": "Agent Ingrid Vole", "house": "Meridian", "tier": "House Law", "title": "Rail Bull — Spine end-of-track", "region": "V", "public": "A frost-bitten railroad agent who guards the Spine's slow, struggling end-of-track.", "dm_prose": "Vole protects the survey crews and the camps from the cold, the claim-jumpers, and whatever the deep cuts turn up — and she's started to believe the crews' stories.", "dm_tag": {"runAs": "Veteran", "beast": "Ankylosaurus · Ironside", "chainUp": "Supt. Greta Holm", "chainDown": "yard crews + station agents"}}, {"name": "\"Pick\" Hannigan", "house": "Meridian", "tier": "House Law", "title": "Rail Bull — Spine camps", "region": "V", "public": "A brutal, pick-handle bull who keeps order in the lawless Spine railhead camps.", "dm_prose": "Hannigan runs the camps by fear because nothing else works that high and cold; even Holm gives him a wide berth.", "dm_tag": {"runAs": "Thug (brutal)", "beast": "Pachycephalosaurus · Ram", "chainUp": "Supt. Greta Holm", "chainDown": "yard crews + station agents"}}, {"name": "Agent Silas Dunmore", "house": "Meridian", "tier": "House Law", "title": "Rail Bull — Western line", "region": "I", "public": "A quiet, watchful railroad agent on the lonely Western line out toward crater country.", "dm_prose": "Dunmore is Reed's man in more ways than the Chairman knows — he looks the other way on the Newcome freight for the same cut his Super takes.", "dm_tag": {"runAs": "Veteran", "beast": "Utahraptor · Sidewinder", "chainUp": "Supt. August Reed", "chainDown": "yard crews + station agents"}}, {"name": "\"Quiet\" Nell Baskin", "house": "Meridian", "tier": "House Law", "title": "Rail Bull — Bargate terminus", "region": "I", "public": "A soft-spoken bull who works the far Western terminus at Bargate, end of the line.", "dm_prose": "Baskin has guarded the Bargate full-stop so long she knows every face that comes off the last train — and remembers which ones never got back on.", "dm_tag": {"runAs": "Veteran", "beast": "Ankylosaurus · Ironside", "chainUp": "Supt. August Reed", "chainDown": "yard crews + station agents"}}, {"name": "Merle Fitch", "house": "Meridian", "tier": "Local", "title": "Station Agent — Rhynllo", "region": "VII", "public": "The Meridian station agent at Rhynllo yard — harried, ink-stained, runs the busiest desk on the frontier.", "dm_prose": "Sees every manifest that leaves the hub and has learned not to read the sealed ones.", "dm_tag": {"runAs": "Commoner (or Thug if pressed)", "beast": "Troodon · Coyote", "chainUp": "Supt. Harlan Cole", "chainDown": "—"}}, {"name": "Opal Deane", "house": "Meridian", "tier": "Local", "title": "Station Agent — Leford", "region": "VII", "public": "The station agent at Leford — a sharp old woman who misses nothing on her platform.", "dm_prose": "Knows who got on and off every train for thirty years; a goldmine for a party who earns her trust.", "dm_tag": {"runAs": "Commoner (or Thug if pressed)", "beast": "Troodon · Coyote", "chainUp": "Supt. Harlan Cole", "chainDown": "—"}}, {"name": "Rufus Kell", "house": "Meridian", "tier": "Local", "title": "Station Agent — Cleaburg", "region": "VII", "public": "The station agent at Cleaburg — nervous, eager to please the line.", "dm_prose": "Will tell the bulls anything to stay in the company's good graces; cheap to buy, cheaper to frighten.", "dm_tag": {"runAs": "Commoner (or Thug if pressed)", "beast": "Compsognathus · Coyote", "chainUp": "Supt. Harlan Cole", "chainDown": "—"}}, {"name": "Bess Harrow", "house": "Meridian", "tier": "Local", "title": "Station Agent — Finch", "region": "VII", "public": "The station agent at Finch — brisk and competent, keeps the little depot spotless.", "dm_prose": "Quietly feeds the Press scraps about freight she thinks is wrong, and doesn't know how dangerous that is.", "dm_tag": {"runAs": "Commoner (or Thug if pressed)", "beast": "Troodon · Coyote", "chainUp": "Supt. Harlan Cole", "chainDown": "—"}}, {"name": "Amos Dunn", "house": "Meridian", "tier": "Local", "title": "Station Agent — Eulabrien", "region": "VII", "public": "The station agent at Eulabrien — a tired man working a stop the line is slowly abandoning.", "dm_prose": "Watches his town die by timetable and hates the company he still works for; a marked man if Meridian notices his bitterness.", "dm_tag": {"runAs": "Commoner (or Thug if pressed)", "beast": "Edmontosaurus · Ironside", "chainUp": "Supt. Harlan Cole", "chainDown": "—"}}, {"name": "Eli Mratz", "house": "Meridian", "tier": "Local", "title": "Station Agent — Teagrove", "region": "VI", "public": "The station agent at Teagrove junction — young, ambitious, company to the bone.", "dm_prose": "Wants Vance to notice him and will do grubby favors to get there.", "dm_tag": {"runAs": "Commoner (or Thug if pressed)", "beast": "Compsognathus · Coyote", "chainUp": "Supt. Odette Vance", "chainDown": "—"}}, {"name": "Dovie Shanks", "house": "Meridian", "tier": "Local", "title": "Station Agent — Goaton", "region": "VI", "public": "The station agent at Goaton — cheerful, gossipy, knows the whole district's business.", "dm_prose": "A fountain of local rumor, some of it even true; the easiest friendly contact on the central line.", "dm_tag": {"runAs": "Commoner (or Thug if pressed)", "beast": "Troodon · Coyote", "chainUp": "Supt. Odette Vance", "chainDown": "—"}}, {"name": "Thaddeus Moss", "house": "Meridian", "tier": "Local", "title": "Station Agent — Argent", "region": "VI", "public": "The station agent at Argent — fussy and precise, proud of his on-time record.", "dm_prose": "Keeps immaculate logs that would hang half the division if anyone thought to subpoena them.", "dm_tag": {"runAs": "Commoner (or Thug if pressed)", "beast": "Troodon · Coyote", "chainUp": "Supt. Odette Vance", "chainDown": "—"}}, {"name": "Winnie Coard", "house": "Meridian", "tier": "Local", "title": "Station Agent — Beabreech", "region": "I", "public": "The station agent at Beabreech, the deep-south junction — leathery and unbothered.", "dm_prose": "Sees the Sabine and Newcome freight meet the rail here and has stopped asking what's in it.", "dm_tag": {"runAs": "Commoner (or Thug if pressed)", "beast": "Edmontosaurus · Ironside", "chainUp": "Supt. August Reed", "chainDown": "—"}}, {"name": "Gus Trimble", "house": "Meridian", "tier": "Local", "title": "Station Agent — Lost City / Bargate", "region": "I", "public": "The station agent at the Bargate terminus by Lost City — end-of-the-line melancholy in a man.", "dm_prose": "The last friendly face before the empty country; knows every soul who rode out and never came back.", "dm_tag": {"runAs": "Commoner (or Thug if pressed)", "beast": "Troodon · Coyote", "chainUp": "Supt. August Reed", "chainDown": "—"}}, {"name": "Cleo Vance", "house": "Meridian", "tier": "Local", "title": "Station Agent — Barot", "region": "I", "public": "The station agent at Barot — distant kin to the Greenreach Super and touchy about it.", "dm_prose": "Trades on the family name she barely has; useful to a party who flatters her.", "dm_tag": {"runAs": "Commoner (or Thug if pressed)", "beast": "Compsognathus · Coyote", "chainUp": "Supt. August Reed", "chainDown": "—"}}, {"name": "Harlow Pike", "house": "Meridian", "tier": "Local", "title": "Station Agent — Redgrass siding", "region": "II", "public": "The station agent at the lonely Redgrass siding — jumpy, always watching the range.", "dm_prose": "Caught between the line and Sabine's riders and terrified of both; will spill anything to whoever scares him more.", "dm_tag": {"runAs": "Commoner (or Thug if pressed)", "beast": "Compsognathus · Coyote", "chainUp": "Supt. Isaiah Ford", "chainDown": "—"}}, {"name": "Abel Thresh", "house": "Sabine", "tier": "Region Lord", "title": "Range Boss — the Redgrass", "region": "II", "public": "Range Boss of House Sabine over the Redgrass — the weathered cattle-country man who runs the greatest herds on the open range. Unhurried, courteous, and somehow everywhere at once.", "dm_prose": "Late 50s, sun-leathered and cattle-country big, grey mustache, with a way of looking at people the way he looks at cattle: counting. Under the courtesy he is the foreman of a harvest — he treats folk as inventory and is not cruel for sport, which is worse. Tell: warmth that turns to counting — supper, then 'how many ride with you?'", "dm_tag": {"runAs": "Fighter (Battle Master) 8; run as Veteran +2 CR with Commander's Strike", "beast": "Triceratops · Longhorn (a bred, clever horn-bull)", "chainUp": "Doña Ysabel Sabine", "chainDown": "stock-detectives + ranch foremen"}}, {"name": "Range Boss Delphine Marsh", "house": "Sabine", "tier": "Region Lord", "title": "Range Boss — the Greenreach", "region": "VI", "public": "Range Boss of House Sabine in the Greenreach, where the ranches push against the jungle and the rail. A genteel, iron-spined woman steadily expanding Sabine's range eastward.", "dm_prose": "Marsh carves cattle range out of Greenreach jungle and feuds quietly with Meridian over every mile of it. Ambitious and expansionist, she breeds the clever stock hard and ships more down the line than any boss but Thresh. Tell: she talks 'improvement' and 'clearing' like a surveyor — and the towns in the way get cleared.", "dm_tag": {"runAs": "Fighter/Noble 7; Veteran +1 CR", "beast": "Styracosaurus · Longhorn", "chainUp": "Doña Ysabel Sabine", "chainDown": "stock-detectives + ranch foremen"}}, {"name": "Range Boss Cassius Dorn", "house": "Sabine", "tier": "Region Lord", "title": "Range Boss — the Sunder Basin", "region": "I", "public": "Range Boss of House Sabine over the thin, tough herds of the Sunder Basin, where cattle country meets crater country. A lean desert man for whom water is everything.", "dm_prose": "Dorn runs the hardest, driest range Sabine holds, where a herd lives or dies by who owns the water — and Dorn owns the water. He feuds with Newcome over crater-country grazing and sells quiet access to both sides. Tell: he gets generous with water right before he takes something bigger than water.", "dm_tag": {"runAs": "Veteran (frontier rancher)", "beast": "Pentaceratops · Longhorn", "chainUp": "Doña Ysabel Sabine", "chainDown": "stock-detectives + ranch foremen"}}, {"name": "Chief Stock-Detective Lemuel Boyd", "house": "Sabine", "tier": "House Law", "title": "Chief of the Stock-Detectives", "region": "Frontier", "public": "The head of House Sabine's stock-detectives — the range riders who hunt rustlers and settle disputes out where no marshal rides. A soft-spoken man with a hangman's patience.", "dm_prose": "Boyd runs every stock-detective Sabine fields and is the Patrona's quiet knife: rustlers found hanged, range disputes that end with one party simply gone, the stampede's true handlers. He keeps a private ledger of 'accounts settled' and sleeps fine — a hired killer with a brand.", "dm_tag": {"runAs": "Assassin/Veteran, +2 CR", "beast": "Utahraptor · Sidewinder", "chainUp": "Doña Ysabel Sabine", "chainDown": "range riders"}}, {"name": "Stock-Detective Oleta Vargas", "house": "Sabine", "tier": "House Law", "title": "Stock-Detective — the Redgrass", "region": "II", "public": "A quiet, watchful range rider who works the Redgrass for Sabine, hunting rustlers.", "dm_prose": "Vargas is patient and genuinely good at reading a trail; she brings in more 'rustlers' than anyone, and not all of them were rustlers before Sabine wanted their land.", "dm_tag": {"runAs": "Scout/Veteran", "beast": "Deinonychus · Sidewinder", "chainUp": "Chief Boyd & Abel Thresh", "chainDown": "range riders"}}, {"name": "Stock-Detective \"Cord\" Mercer", "house": "Sabine", "tier": "House Law", "title": "Stock-Detective — the Redgrass", "region": "II", "public": "A rope-lean range rider known for never raising his voice.", "dm_prose": "Mercer handles the ugly end of Thresh's harvest — the families that 'move on,' the homesteads that burn down by accident. He tells himself the brand makes it lawful.", "dm_tag": {"runAs": "Veteran", "beast": "Achillobator · Sidewinder", "chainUp": "Chief Boyd & Abel Thresh", "chainDown": "range riders"}}, {"name": "Stock-Detective Bram Tolliver", "house": "Sabine", "tier": "House Law", "title": "Stock-Detective — the Desolations edge", "region": "II", "public": "A grim rider who patrols the dead-flats edge of the Redgrass, where the Desolations begin.", "dm_prose": "Tolliver works the belt nobody else will and has seen things out on the dead-flats he won't discuss; steady, haunted, and the closest a Sabine detective comes to decent.", "dm_tag": {"runAs": "Veteran", "beast": "Edmontosaurus · Ironside", "chainUp": "Chief Boyd & Abel Thresh", "chainDown": "range riders"}}, {"name": "Stock-Detective Reuben Ash", "house": "Sabine", "tier": "House Law", "title": "Stock-Detective — the Redgrass", "region": "II", "public": "A broad, calm rider who is always near the herd when it moves.", "dm_prose": "Ash is a stampede-handler: when a town or a holdout needs to become a 'tragic accident of spooked cattle,' he is the man who points the herd. Reads as a quiet cowhand.", "dm_tag": {"runAs": "Veteran", "beast": "Stygimoloch · Ram", "chainUp": "Chief Boyd & Abel Thresh", "chainDown": "range riders"}}, {"name": "Stock-Detective Delia Sunn", "house": "Sabine", "tier": "House Law", "title": "Stock-Detective — the Greenreach", "region": "VI", "public": "A sharp, jungle-wise range rider who works Marsh's expanding Greenreach range.", "dm_prose": "Sunn clears the 'obstacles' to new range — squatters, Treaty-kept holdouts, inconvenient surveyors — and is proud of how clean she leaves it.", "dm_tag": {"runAs": "Veteran", "beast": "Utahraptor · Sidewinder", "chainUp": "Chief Boyd & Delphine Marsh", "chainDown": "range riders"}}, {"name": "Stock-Detective Gaius Hollis", "house": "Sabine", "tier": "House Law", "title": "Stock-Detective — the Greenreach spurs", "region": "VI", "public": "A genial, dangerous rider who works the Greenreach spur country.", "dm_prose": "Hollis befriends a town before he ruins it; the friendliest Sabine man you'll meet and the last one you'd want on your trail.", "dm_tag": {"runAs": "Veteran", "beast": "Deinonychus · Sidewinder", "chainUp": "Chief Boyd & Delphine Marsh", "chainDown": "range riders"}}, {"name": "Stock-Detective Marisol Ruiz", "house": "Sabine", "tier": "House Law", "title": "Stock-Detective — the Sunder Basin", "region": "I", "public": "A desert-hard range rider who guards Dorn's thin basin herds and their precious water.", "dm_prose": "Ruiz kills over water and calls it rustling; the crater camps have learned to pay Dorn rather than cross her.", "dm_tag": {"runAs": "Veteran", "beast": "Achillobator · Sidewinder", "chainUp": "Chief Boyd & Cassius Dorn", "chainDown": "range riders"}}, {"name": "Stock-Detective \"Dry\" Calder", "house": "Sabine", "tier": "House Law", "title": "Stock-Detective — crater-country range", "region": "I", "public": "A sun-blasted, laconic rider who works the edge where Sabine range meets Newcome's claims.", "dm_prose": "Calder runs the quiet war with Newcome's claim-guards — fence-cuttings, poisoned wells, bodies the buzzards find — and takes coin from Dorn to keep it quiet.", "dm_tag": {"runAs": "Veteran", "beast": "Deinonychus · Sidewinder", "chainUp": "Chief Boyd & Cassius Dorn", "chainDown": "range riders"}}, {"name": "Enoch Pryor", "house": "Sabine", "tier": "Local", "title": "Ranch Foreman — the Thresh home ranch", "region": "II", "public": "Foreman of Sabine's great Redgrass home ranch — grizzled, fair to his hands, loyal to the brand.", "dm_prose": "Runs the heart of Thresh's operation and would die for Sabine without ever asking what the brand really does.", "dm_tag": {"runAs": "Commoner/Scout", "beast": "Triceratops · Longhorn", "chainUp": "Abel Thresh", "chainDown": "—"}}, {"name": "Sadie Lum", "house": "Sabine", "tier": "Local", "title": "Ranch Foreman — the Dustwater spread", "region": "II", "public": "Foreman of the Dustwater spread — brisk, no-nonsense, keeps a tight crew.", "dm_prose": "Knows exactly which of the herd are the 'clever' stock and has stopped letting herself think about where they go.", "dm_tag": {"runAs": "Commoner/Scout", "beast": "Edmontosaurus · Ironside", "chainUp": "Abel Thresh", "chainDown": "—"}}, {"name": "Abner Teale", "house": "Sabine", "tier": "Local", "title": "Ranch Foreman — the Redgrass line camps", "region": "II", "public": "Foreman over the Redgrass line camps — weather-beaten, endlessly patient.", "dm_prose": "Moves cattle and keeps his mouth shut; a decent man who looks away for a decent wage.", "dm_tag": {"runAs": "Commoner/Scout", "beast": "Parasaurolophus · Trailboss", "chainUp": "Abel Thresh", "chainDown": "—"}}, {"name": "Pearl Oduya", "house": "Sabine", "tier": "Local", "title": "Ranch Foreman — the Breaks station", "region": "II", "public": "Foreman at the Breaks grazing station — young, ambitious, wants a detective's badge.", "dm_prose": "Eager to prove herself to Thresh and dangerous because of it.", "dm_tag": {"runAs": "Commoner/Scout", "beast": "Styracosaurus · Longhorn", "chainUp": "Abel Thresh", "chainDown": "—"}}, {"name": "Caleb Finnan", "house": "Sabine", "tier": "Local", "title": "Ranch Foreman — the Witchmoor range", "region": "II", "public": "Foreman of the Witchmoor-edge range — superstitious, keeps charms on the fence posts.", "dm_prose": "Half his hands have quit over things seen near the mire; he stays for the pay and prays.", "dm_tag": {"runAs": "Commoner/Scout", "beast": "Edmontosaurus · Ironside", "chainUp": "Abel Thresh", "chainDown": "—"}}, {"name": "Rosa Benteen", "house": "Sabine", "tier": "Local", "title": "Ranch Foreman — the Soudale pens", "region": "II", "public": "Foreman of the Soudale holding pens — sharp-eyed, runs the sorting.", "dm_prose": "Does the literal sorting of the stock and has made peace with it the way a slaughterman does.", "dm_tag": {"runAs": "Commoner/Scout", "beast": "Ankylosaurus · Ironside", "chainUp": "Abel Thresh", "chainDown": "—"}}, {"name": "Gideon Marsh", "house": "Sabine", "tier": "Local", "title": "Ranch Foreman — the Greenreach home ranch", "region": "VI", "public": "Foreman of Marsh's Greenreach home ranch — her cousin, steady and expansion-minded.", "dm_prose": "Runs the jungle-edge spreads and clears land with a clear conscience and a dull imagination.", "dm_tag": {"runAs": "Commoner/Scout", "beast": "Triceratops · Longhorn", "chainUp": "Delphine Marsh", "chainDown": "—"}}, {"name": "Twyla Reeves", "house": "Sabine", "tier": "Local", "title": "Ranch Foreman — the Elysian-edge range", "region": "VI", "public": "Foreman at the Elysian jungle edge — tough, malarial, half-wild.", "dm_prose": "Lost two crews to the jungle and a third to 'clearing' work she won't describe.", "dm_tag": {"runAs": "Commoner/Scout", "beast": "Styracosaurus · Longhorn", "chainUp": "Delphine Marsh", "chainDown": "—"}}, {"name": "Jonas Okebe", "house": "Sabine", "tier": "Local", "title": "Ranch Foreman — the Hato spur ranch", "region": "VI", "public": "Foreman of the Hato spur ranch — genial, trades cattle talk with every passerby.", "dm_prose": "A good source of rumor who doesn't know he's also a good source of intelligence for Sabine.", "dm_tag": {"runAs": "Commoner/Scout", "beast": "Parasaurolophus · Trailboss", "chainUp": "Delphine Marsh", "chainDown": "—"}}, {"name": "Hettie Dorn", "house": "Sabine", "tier": "Local", "title": "Ranch Foreman — the Sunder home ranch", "region": "I", "public": "Foreman of Dorn's Sunder Basin home ranch — his sister, hard as the country.", "dm_prose": "Guards the water that keeps the whole basin herd — and the whole basin — in Sabine's grip.", "dm_tag": {"runAs": "Commoner/Scout", "beast": "Pentaceratops · Longhorn", "chainUp": "Cassius Dorn", "chainDown": "—"}}, {"name": "Milo Vane", "house": "Sabine", "tier": "Local", "title": "Ranch Foreman — the crater-edge grazing", "region": "I", "public": "Foreman over the crater-edge grazing camps — jumpy, always eyeing Newcome's claims.", "dm_prose": "Caught in the quiet war with Newcome and sure he'll be the next body the buzzards find.", "dm_tag": {"runAs": "Commoner/Scout", "beast": "Edmontosaurus · Ironside", "chainUp": "Cassius Dorn", "chainDown": "—"}}, {"name": "Agnes Pell", "house": "Sabine", "tier": "Local", "title": "Ranch Foreman — the Dagra Waste wells", "region": "I", "public": "Foreman at the Dagra Waste wells — leathery, miserly with every drop.", "dm_prose": "Controls the wells that decide who lives out here and lords the little power over everyone.", "dm_tag": {"runAs": "Commoner/Scout", "beast": "Ankylosaurus · Ironside", "chainUp": "Cassius Dorn", "chainDown": "—"}}, {"name": "Prelate Father Odo Wren", "house": "Radiant", "tier": "Region Lord", "title": "Prelate of the Wall — the Scald", "region": "III", "public": "The senior Prelate of House Radiant, who runs the great mission country of the Scald. A stern, luminous priest, second only to the Luminary in the people's love.", "dm_prose": "Wren rules the Scald's missions with real faith and real cruelty braided so tight he can't tell them apart. He personally approves which souls in his region 'give themselves wholly to the Light,' and believes every one a mercy. Tell: the warmer his blessing on a lonely, friendless traveler, the shorter their future.", "dm_tag": {"runAs": "Priest (archpriest), +1 CR", "beast": "Triceratops · Longhorn (the wall of the faith)", "chainUp": "the Luminary, Ambrose Radiant", "chainDown": "Lamplighters + parish wardens"}}, {"name": "Prelate Mother Cerys Vale", "house": "Radiant", "tier": "Region Lord", "title": "Prelate of the Wall — the Sunder Basin", "region": "I", "public": "Prelate of House Radiant over the crater-country missions of the Sunder Basin, where the church is often the only sanctuary for a hundred miles. Beloved by the desperate.", "dm_prose": "Vale's missions are the one soft place in a brutal country, which is exactly what makes them the perfect net: the drifting, the ruined, the newly orphaned come to her, and she decides which of them the Light keeps. She is genuinely kind, and that is the horror.", "dm_tag": {"runAs": "Priest, Veteran lean", "beast": "Parasaurolophus · Trailboss", "chainUp": "the Luminary, Ambrose Radiant", "chainDown": "Lamplighters + parish wardens"}}, {"name": "Prelate Father Gideon Poole", "house": "Radiant", "tier": "Region Lord", "title": "Prelate of the Wall — the Redgrass", "region": "II", "public": "Prelate of House Radiant across the Redgrass missions, riding a long circuit between far-flung chapels. A tireless, weather-beaten shepherd.", "dm_prose": "Poole works hand in glove with Sabine — the ranch hands who 'move on' often move on through his missions and out the far side, into the Light. He tells himself he's only receiving the lost. Tell: he never asks where a new convert came from.", "dm_tag": {"runAs": "Priest, Veteran", "beast": "Ankylosaurus · Ironside", "chainUp": "the Luminary, Ambrose Radiant", "chainDown": "Lamplighters + parish wardens"}}, {"name": "Prelate Mother Junia Okonkwo", "house": "Radiant", "tier": "Region Lord", "title": "Prelate of the Wall — the Greenreach", "region": "VI", "public": "Prelate of House Radiant in the Greenreach, carrying the wall and the light into the deep jungle missions. Fervent, fearless, feverish.", "dm_prose": "Okonkwo is an expansionist true believer who plants missions where Sabine wants range cleared and Meridian wants track laid — the church sanctifies the taking. The marked here simply vanish into the green. Tell: her zeal spikes right before a town changes hands.", "dm_tag": {"runAs": "Priest (zealot), Veteran", "beast": "Corythosaurus · Trailboss", "chainUp": "the Luminary, Ambrose Radiant", "chainDown": "Lamplighters + parish wardens"}}, {"name": "Brother Silas Mourne", "house": "Radiant", "tier": "House Law", "title": "the First Lamp", "region": "Frontier", "public": "The First Lamp of House Radiant — head of the Lamplighters, the quiet brothers who tend the mission lamps and shepherd new converts. A gentle, smiling man.", "dm_prose": "Mourne runs every Lamplighter on the frontier. They are the church's takers: they come for the marked softly, by lamplight, and the convert gives himself wholly to the Light and is never seen again. Mourne keeps the rolls of the taken and calls the whole bloody pipeline a ministry.", "dm_tag": {"runAs": "Priest/Assassin, +2 CR", "beast": "Velociraptor · Coyote", "chainUp": "the Luminary, Ambrose Radiant", "chainDown": "mission wardens"}}, {"name": "Lamplighter Brother Enoch Tiller", "house": "Radiant", "tier": "House Law", "title": "Lamplighter — the Scald", "region": "III", "public": "A soft-spoken Lamplighter of the Scald missions who tends the lamps and comforts the lost.", "dm_prose": "One of Wren's quiet takers; he befriends the friendless so that no one notices when they're gone.", "dm_tag": {"runAs": "Cultist/Spy (Skulker)", "beast": "Troodon · Coyote", "chainUp": "Brother Mourne & Prelate Wren", "chainDown": "mission wardens"}}, {"name": "Lamplighter Sister Agatha Cree", "house": "Radiant", "tier": "House Law", "title": "Lamplighter — the Scald", "region": "III", "public": "A patient, kindly Lamplighter who sits with the sick and the dying.", "dm_prose": "She marks the ones with no one to miss them, then signs them over to the Light; she weeps at every one and does it anyway.", "dm_tag": {"runAs": "Acolyte/Spy", "beast": "Troodon · Coyote", "chainUp": "Brother Mourne & Prelate Wren", "chainDown": "mission wardens"}}, {"name": "Lamplighter Brother Caius Veldt", "house": "Radiant", "tier": "House Law", "title": "Lamplighter — the Sunder Basin", "region": "I", "public": "A watchful Lamplighter of the crater-country missions.", "dm_prose": "Veldt works the boomtowns where people vanish anyway, which makes his work invisible; the easiest harvest on the frontier.", "dm_tag": {"runAs": "Cultist/Spy", "beast": "Velociraptor · Coyote", "chainUp": "Brother Mourne & Prelate Vale", "chainDown": "mission wardens"}}, {"name": "Lamplighter Sister Noor Haddad", "house": "Radiant", "tier": "House Law", "title": "Lamplighter — the Sunder Basin", "region": "I", "public": "A gentle Lamplighter who runs the mission's charity kitchen.", "dm_prose": "She feeds the desperate and learns which of them no one would miss; her kindness is a census.", "dm_tag": {"runAs": "Acolyte/Spy", "beast": "Troodon · Coyote", "chainUp": "Brother Mourne & Prelate Vale", "chainDown": "mission wardens"}}, {"name": "Lamplighter Brother Josiah Penn", "house": "Radiant", "tier": "House Law", "title": "Lamplighter — the Redgrass", "region": "II", "public": "A circuit Lamplighter who rides between the Redgrass chapels.", "dm_prose": "Collects Sabine's 'moved-on' hands at the mission door and ushers them quietly into the Light.", "dm_tag": {"runAs": "Assassin (lean)", "beast": "Deinonychus · Sidewinder", "chainUp": "Brother Mourne & Prelate Poole", "chainDown": "mission wardens"}}, {"name": "Lamplighter Sister Delphine Orr", "house": "Radiant", "tier": "House Law", "title": "Lamplighter — the Redgrass", "region": "II", "public": "A brisk Lamplighter who keeps the Redgrass mission rolls.", "dm_prose": "Keeps the paperwork that turns a vanished drifter into a tidy 'convert'; the clean hands of a dirty ledger.", "dm_tag": {"runAs": "Spy (clerk)", "beast": "Troodon · Coyote", "chainUp": "Brother Mourne & Prelate Poole", "chainDown": "mission wardens"}}, {"name": "Lamplighter Brother Tomas Ngai", "house": "Radiant", "tier": "House Law", "title": "Lamplighter — the Greenreach", "region": "VI", "public": "A jungle Lamplighter, lean and fever-bright.", "dm_prose": "Takes the marked into the green where even the Press can't follow; the most final of all the takers.", "dm_tag": {"runAs": "Cultist/Assassin", "beast": "Velociraptor · Coyote", "chainUp": "Brother Mourne & Prelate Okonkwo", "chainDown": "mission wardens"}}, {"name": "Lamplighter Sister Beatrix Vane", "house": "Radiant", "tier": "House Law", "title": "Lamplighter — the Greenreach", "region": "VI", "public": "A devout Lamplighter who runs the deepest jungle mission.", "dm_prose": "True-believing and remorseless; she thinks the Light is mercy and the vanished are saved.", "dm_tag": {"runAs": "Cultist (zealot)", "beast": "Troodon · Coyote", "chainUp": "Brother Mourne & Prelate Okonkwo", "chainDown": "mission wardens"}}, {"name": "Deacon Harrow Plume", "house": "Radiant", "tier": "Local", "title": "Parish Warden — the Ashmaw mission", "region": "III", "public": "Parish warden of the great Ashmaw mission — stout, devout, runs the daily charity.", "dm_prose": "Keeps the mission running and has never once looked behind the Lamplighters' curtain.", "dm_tag": {"runAs": "Priest/Commoner", "beast": "Triceratops · Longhorn", "chainUp": "Prelate Wren", "chainDown": "—"}}, {"name": "Sister Willa Teague", "house": "Radiant", "tier": "Local", "title": "Parish Warden — the Scald chapels", "region": "III", "public": "Circuit warden of the scattered Scald chapels — kind, tireless, trusted by all.", "dm_prose": "A genuinely good woman the church uses as its honest face.", "dm_tag": {"runAs": "Priest/Commoner", "beast": "Parasaurolophus · Trailboss", "chainUp": "Prelate Wren", "chainDown": "—"}}, {"name": "Deacon Amos Reel", "house": "Radiant", "tier": "Local", "title": "Parish Warden — the Kashoy mission", "region": "III", "public": "Parish warden of the Kashoy desert mission — gruff, protective of his flock.", "dm_prose": "Would turn on the church in a heartbeat if he ever learned the truth; a lever waiting to be pulled.", "dm_tag": {"runAs": "Priest/Commoner", "beast": "Ankylosaurus · Ironside", "chainUp": "Prelate Wren", "chainDown": "—"}}, {"name": "Sister Oona Blight", "house": "Radiant", "tier": "Local", "title": "Parish Warden — the vent chapels", "region": "III", "public": "Warden of the volcanic-vent chapels — half-mad with heat and faith.", "dm_prose": "Sees signs and portents in the vents; occasionally, terrifyingly, right.", "dm_tag": {"runAs": "Priest/Commoner", "beast": "Edmontosaurus · Ironside", "chainUp": "Prelate Wren", "chainDown": "—"}}, {"name": "Deacon Ruth Calder", "house": "Radiant", "tier": "Local", "title": "Parish Warden — the Scafield mission", "region": "I", "public": "Parish warden of the Scafield boomtown mission — harried, overwhelmed, good-hearted.", "dm_prose": "Takes in more lost souls than she can feed and never notices the Lamplighters thinning them.", "dm_tag": {"runAs": "Priest/Commoner", "beast": "Triceratops · Longhorn", "chainUp": "Prelate Vale", "chainDown": "—"}}, {"name": "Brother Eli Vance", "house": "Radiant", "tier": "Local", "title": "Parish Warden — the crater missions", "region": "I", "public": "Circuit warden of the crater-country missions — young, idealistic, newly ordained.", "dm_prose": "Still believes every word; the saddest man on the frontier once he learns otherwise.", "dm_tag": {"runAs": "Priest/Commoner", "beast": "Corythosaurus · Trailboss", "chainUp": "Prelate Vale", "chainDown": "—"}}, {"name": "Sister Marta Dune", "house": "Radiant", "tier": "Local", "title": "Parish Warden — the Devouring-edge chapel", "region": "I", "public": "Warden of the lonely chapel at the edge of the Sands of Devouring.", "dm_prose": "Keeps a lamp burning for travelers lost to the salt; a true mercy, for once.", "dm_tag": {"runAs": "Priest/Commoner", "beast": "Parasaurolophus · Trailboss", "chainUp": "Prelate Vale", "chainDown": "—"}}, {"name": "Deacon Silas Poole", "house": "Radiant", "tier": "Local", "title": "Parish Warden — the Redgrass circuit", "region": "II", "public": "Circuit warden of the Redgrass chapels — Poole's nephew, eager and loyal.", "dm_prose": "Rides the long circuit and carries the Prelate's messages, half of them he can't read.", "dm_tag": {"runAs": "Priest/Commoner", "beast": "Edmontosaurus · Ironside", "chainUp": "Prelate Poole", "chainDown": "—"}}, {"name": "Sister Hannah Vey", "house": "Radiant", "tier": "Local", "title": "Parish Warden — the Desolations mission", "region": "II", "public": "Warden of the grim mission at the Desolations' edge.", "dm_prose": "Ministers to a town the dead-flats are slowly swallowing and prays it isn't judgment.", "dm_tag": {"runAs": "Priest/Commoner", "beast": "Ankylosaurus · Ironside", "chainUp": "Prelate Poole", "chainDown": "—"}}, {"name": "Deacon Obed Krane", "house": "Radiant", "tier": "Local", "title": "Parish Warden — the cattle-town chapels", "region": "II", "public": "Parish warden of the Redgrass cattle-town chapels — backslapping, well-fed.", "dm_prose": "Cozy with Sabine's foremen and happy not to ask questions.", "dm_tag": {"runAs": "Priest/Commoner", "beast": "Corythosaurus · Trailboss", "chainUp": "Prelate Poole", "chainDown": "—"}}, {"name": "Sister Adaeze Nri", "house": "Radiant", "tier": "Local", "title": "Parish Warden — the Greenreach missions", "region": "VI", "public": "Warden of the Greenreach jungle missions — brave, malarial, devoted.", "dm_prose": "Buries more converts than she baptizes and blames the fever, not the Lamplighters.", "dm_tag": {"runAs": "Priest/Commoner", "beast": "Styracosaurus · Longhorn", "chainUp": "Prelate Okonkwo", "chainDown": "—"}}, {"name": "Brother Lot Pardee", "house": "Radiant", "tier": "Local", "title": "Parish Warden — the Elysian chapel", "region": "VI", "public": "Warden of the deep Elysian-jungle chapel — isolated, half-feral, fervent.", "dm_prose": "So far out he's the only law, the only doctor, and the only one who hears what happens in the dark.", "dm_tag": {"runAs": "Priest/Commoner", "beast": "Edmontosaurus · Ironside", "chainUp": "Prelate Okonkwo", "chainDown": "—"}}, {"name": "Factor Hiram Blyte", "house": "Merrow", "tier": "Region Lord", "title": "Factor — the Tideward", "region": "VII", "public": "The senior Factor of House Merrow, who keeps the great ledgers of the Tideward — the bank's heartland and its deepest vaults. A precise, bloodless man who forgets nothing.", "dm_prose": "Blyte sits atop the oldest archives on the frontier and knows where every body of paper is buried. He holds the notes on half the Tideward's shipping and all of its secrets, and he never threatens — the paper comes due on a date he set years ago. (His vaults hold records that could hang the whole Table; he keeps them as collateral, not conscience.)", "dm_tag": {"runAs": "Noble/Spymaster, +1 CR", "beast": "Utahraptor · Sidewinder (a cold thing on a short leash)", "chainUp": "First Clerk Pierpont Merrow", "chainDown": "collectors + branch clerks"}}, {"name": "Factor Ophelia Creed", "house": "Merrow", "tier": "Region Lord", "title": "Factor — the Drownlands", "region": "IV", "public": "Factor of House Merrow in the Drownlands, where the bank's money moves quietly through the bayou and the river trade. A patient, smiling woman who is always owed.", "dm_prose": "Creed banks the Redhand smugglers and the riverboat trade both, taking a clean cut of every dirty dollar. She owns more of the Drownlands than the Redhand realize, through debts they don't know they signed. Tell: her smile warms as the noose on your paper tightens.", "dm_tag": {"runAs": "Noble (banker)", "beast": "Deinonychus · Sidewinder", "chainUp": "First Clerk Pierpont Merrow", "chainDown": "collectors + branch clerks"}}, {"name": "Factor Cato Welles", "house": "Merrow", "tier": "Region Lord", "title": "Factor — the Scald", "region": "III", "public": "Factor of House Merrow across the Scald, who finances the missions and the mines and holds the paper on both. Austere, tireless, devout in his way.", "dm_prose": "Welles funds Radiant's missions and quietly holds the notes, which makes the church owe the bank — a leash on a leash. He believes money and salvation are the same ledger. Tell: he quotes scripture right before he forecloses.", "dm_tag": {"runAs": "Noble, Priest lean", "beast": "Ankylosaurus · Ironside", "chainUp": "First Clerk Pierpont Merrow", "chainDown": "collectors + branch clerks"}}, {"name": "Factor Lucinda Graves", "house": "Merrow", "tier": "Region Lord", "title": "Factor — the Greenreach", "region": "VI", "public": "Factor of House Merrow in the booming Greenreach, financing the rail's expansion and the new ranches. Sharp, modern, hungry for growth.", "dm_prose": "Graves bankrolls Meridian's Greenreach spur and Sabine's new range, so when either overreaches, Merrow owns the pieces. She is engineering a crisis she intends to profit from. Tell: she lends most eagerly to the ventures she expects to fail.", "dm_tag": {"runAs": "Noble (financier)", "beast": "Struthiomimus · Sidewinder", "chainUp": "First Clerk Pierpont Merrow", "chainDown": "collectors + branch clerks"}}, {"name": "Mr. Erasmus Thorn", "house": "Merrow", "tier": "House Law", "title": "Chief Collector", "region": "Frontier", "public": "House Merrow's Chief Collector — the soft-spoken gentleman who oversees every debt collected on the frontier. Immaculate, patient, and never, ever raises his voice.", "dm_prose": "Thorn runs all of Merrow's collectors. He does no violence himself; he simply presents the paper, and then the marshals, the bulls, or worse arrive on schedule to enforce it. He has ended more lives with a signature than any gunman with a pistol, and considers himself a man of peace.", "dm_tag": {"runAs": "Spymaster (no personal violence), +1 CR", "beast": "Velociraptor · Coyote", "chainUp": "First Clerk Pierpont Merrow", "chainDown": "process-servers"}}, {"name": "Mr. Cassius Dole", "house": "Merrow", "tier": "House Law", "title": "Collector — the Tideward", "region": "VII", "public": "A courteous Merrow collector who serves the Tideward's merchants and shippers.", "dm_prose": "Arrives with a smile and a folder; the ruin that follows is always, technically, the debtor's own fault.", "dm_tag": {"runAs": "Spy (collector)", "beast": "Deinonychus · Sidewinder", "chainUp": "Mr. Thorn & Factor Blyte", "chainDown": "process-servers"}}, {"name": "Miss Prudence Vane", "house": "Merrow", "tier": "House Law", "title": "Collector — the port debts", "region": "VII", "public": "A brisk, well-dressed collector who works the Tideward ports.", "dm_prose": "Calls in the shipping notes that quietly beach a rival's whole fleet; she enjoys the paperwork more than is healthy.", "dm_tag": {"runAs": "Spy (clerk)", "beast": "Troodon · Coyote", "chainUp": "Mr. Thorn & Factor Blyte", "chainDown": "process-servers"}}, {"name": "Mr. Obadiah Finch", "house": "Merrow", "tier": "House Law", "title": "Repossession agent — the Tideward", "region": "VII", "public": "A grim repo-man who seizes what the paper says is Merrow's.", "dm_prose": "Takes the ships, the stock, the homes; sleeps like a ledger balanced.", "dm_tag": {"runAs": "Thug (process-server)", "beast": "Ankylosaurus · Ironside", "chainUp": "Mr. Thorn & Factor Blyte", "chainDown": "process-servers"}}, {"name": "Mr. Jonah Creel", "house": "Merrow", "tier": "House Law", "title": "Collector — the Drownlands", "region": "IV", "public": "A patient collector who poles the bayou calling in river debts.", "dm_prose": "Knows which Redhand captains are over their heads and lets them sink just slow enough to own them.", "dm_tag": {"runAs": "Spy", "beast": "Deinonychus · Sidewinder", "chainUp": "Mr. Thorn & Factor Creed", "chainDown": "process-servers"}}, {"name": "Miss Delia Marsh", "house": "Merrow", "tier": "House Law", "title": "Collector — the river towns", "region": "IV", "public": "A soft-spoken collector working the Drownlands river towns.", "dm_prose": "Forecloses on the drowned and the disappeared with the same gentle apology.", "dm_tag": {"runAs": "Spy (clerk)", "beast": "Troodon · Coyote", "chainUp": "Mr. Thorn & Factor Creed", "chainDown": "process-servers"}}, {"name": "Mr. Amos Welt", "house": "Merrow", "tier": "House Law", "title": "Collector — the Scald", "region": "III", "public": "A dusty, tireless collector riding the long Scald circuit.", "dm_prose": "Collects from mines and missions alike and tells each he's really on their side.", "dm_tag": {"runAs": "Spy", "beast": "Edmontosaurus · Ironside", "chainUp": "Mr. Thorn & Factor Welles", "chainDown": "process-servers"}}, {"name": "Miss Hester Vane", "house": "Merrow", "tier": "House Law", "title": "Collector — the mining debts", "region": "III", "public": "A hard collector who works the Scald's mining camps.", "dm_prose": "Owns half the picks in the camps through grubstake notes nobody read.", "dm_tag": {"runAs": "Spy", "beast": "Deinonychus · Sidewinder", "chainUp": "Mr. Thorn & Factor Welles", "chainDown": "process-servers"}}, {"name": "Mr. Lucius Pare", "house": "Merrow", "tier": "House Law", "title": "Collector — the Greenreach", "region": "VI", "public": "A sleek, modern collector working the booming Greenreach.", "dm_prose": "Lends with one hand and prepares the foreclosure with the other, exactly as Graves wants.", "dm_tag": {"runAs": "Spy (financier)", "beast": "Utahraptor · Sidewinder", "chainUp": "Mr. Thorn & Factor Graves", "chainDown": "process-servers"}}, {"name": "Silas Prim", "house": "Merrow", "tier": "Local", "title": "Branch Clerk — the Rhynllo branch", "region": "VII", "public": "Branch clerk of Merrow's Rhynllo office — fussy, precise, proud of his penmanship.", "dm_prose": "Processes every rail note through the hub and would faint if he grasped what he's enabling.", "dm_tag": {"runAs": "Commoner (clerk)", "beast": "Troodon · Coyote", "chainUp": "Factor Blyte", "chainDown": "—"}}, {"name": "Winifred Dace", "house": "Merrow", "tier": "Local", "title": "Branch Clerk — the Tideward port branch", "region": "VII", "public": "Branch clerk at the busy Tideward port office — overworked, sharp, underpaid.", "dm_prose": "Quietly resents the bank and could be turned by a party who treats her like a person.", "dm_tag": {"runAs": "Commoner (clerk)", "beast": "Compsognathus · Coyote", "chainUp": "Factor Blyte", "chainDown": "—"}}, {"name": "Ezra Holt", "house": "Merrow", "tier": "Local", "title": "Branch Clerk — the archive annex", "region": "VII", "public": "Clerk of the Tideward archive annex — dusty, incurious, keeps the old ledgers.", "dm_prose": "Guards the vault records without ever reading them; a mountain of evidence he's too bored to notice.", "dm_tag": {"runAs": "Commoner (clerk)", "beast": "Ankylosaurus · Ironside", "chainUp": "Factor Blyte", "chainDown": "—"}}, {"name": "Marguerite Sol", "house": "Merrow", "tier": "Local", "title": "Branch Clerk — the Bacot branch", "region": "IV", "public": "Branch clerk of the Drownlands' Bacot office — genteel, gossipy, loves the river.", "dm_prose": "Knows every captain's debt and shares it over cards without quite meaning to.", "dm_tag": {"runAs": "Commoner (clerk)", "beast": "Troodon · Coyote", "chainUp": "Factor Creed", "chainDown": "—"}}, {"name": "Thaddeus Rue", "house": "Merrow", "tier": "Local", "title": "Branch Clerk — the bayou circuit", "region": "IV", "public": "Circuit clerk poling between the bayou branches — malarial, patient, half-asleep.", "dm_prose": "Carries the paper that drowns river towns and dreams of transferring anywhere drier.", "dm_tag": {"runAs": "Commoner (clerk)", "beast": "Edmontosaurus · Ironside", "chainUp": "Factor Creed", "chainDown": "—"}}, {"name": "Ignatius Bell", "house": "Merrow", "tier": "Local", "title": "Branch Clerk — the Scald branch", "region": "III", "public": "Branch clerk of the Scald office — devout, orderly, splits time with the mission.", "dm_prose": "Keeps the books that bind church to bank and sees no sin in it.", "dm_tag": {"runAs": "Commoner (clerk)", "beast": "Corythosaurus · Trailboss", "chainUp": "Factor Welles", "chainDown": "—"}}, {"name": "Oona Krejci", "house": "Merrow", "tier": "Local", "title": "Branch Clerk — the mining-camp agency", "region": "III", "public": "Clerk of the Scald mining-camp loan agency — brisk, flinty, numerate.", "dm_prose": "Writes the grubstake notes that own the camps; the sharpest clerk on the frontier.", "dm_tag": {"runAs": "Commoner (clerk)", "beast": "Troodon · Coyote", "chainUp": "Factor Welles", "chainDown": "—"}}, {"name": "Baxter Lund", "house": "Merrow", "tier": "Local", "title": "Branch Clerk — the Greenreach branch", "region": "VI", "public": "Branch clerk of the Greenreach office — eager, modern, ambitious.", "dm_prose": "Dreams of being a Factor and will cut any corner Graves implies she wants cut.", "dm_tag": {"runAs": "Commoner (clerk)", "beast": "Compsognathus · Coyote", "chainUp": "Factor Graves", "chainDown": "—"}}, {"name": "Prudence Oke", "house": "Merrow", "tier": "Local", "title": "Branch Clerk — the spur-town agency", "region": "VI", "public": "Clerk of the Greenreach spur-town loan desk — kindly, overwhelmed.", "dm_prose": "Lends to doomed homesteaders because she can't bear to say no, not knowing that's the plan.", "dm_tag": {"runAs": "Commoner (clerk)", "beast": "Troodon · Coyote", "chainUp": "Factor Graves", "chainDown": "—"}}, {"name": "Cornelius Vane", "house": "Merrow", "tier": "Local", "title": "Branch Clerk — the Tideward counting house", "region": "VII", "public": "Clerk of the Tideward counting house — elderly, exact, forty years at the same desk.", "dm_prose": "Has counted the dram-backed accounts so long he no longer sees the blood on the numbers.", "dm_tag": {"runAs": "Commoner (clerk)", "beast": "Edmontosaurus · Ironside", "chainUp": "Factor Blyte", "chainDown": "—"}}, {"name": "Hattie Pelham", "house": "Merrow", "tier": "Local", "title": "Branch Clerk — the Froby branch", "region": "IV", "public": "Branch clerk at the Drownlands' Froby office — young, bright, frightened of Creed.", "dm_prose": "Spotted something wrong in the ledgers and is terrified of what asking would cost.", "dm_tag": {"runAs": "Commoner (clerk)", "beast": "Compsognathus · Coyote", "chainUp": "Factor Creed", "chainDown": "—"}}, {"name": "Rufus Mott", "house": "Merrow", "tier": "Local", "title": "Branch Clerk — the Ashmaw agency", "region": "III", "public": "Clerk of the Scald's Ashmaw loan agency — lazy, cheerful, cuts corners.", "dm_prose": "Rubber-stamps the mission's notes without reading them; an accidental weak link.", "dm_tag": {"runAs": "Commoner (clerk)", "beast": "Troodon · Coyote", "chainUp": "Factor Welles", "chainDown": "—"}}, {"name": "Claim Boss Augustus Roan", "house": "Newcome", "tier": "Region Lord", "title": "Chief Assayer & Claim Boss — the Sunder Basin", "region": "I", "public": "The senior Claim Boss of House Newcome and its Chief Assayer, who runs the crater-rush across the Sunder Basin. A weathered, sharp-eyed man with uncanny timing.", "dm_prose": "Roan is Meyer's right hand on the ground: he reads the sky almost as well as the Sky-Reader himself and is first to every fall in the basin. He weighs what comes out of the shells — and he sees the living cargo hauled off to the mills while he counts the gems, and says nothing. The keystone's foreman.", "dm_tag": {"runAs": "Noble/Scout with uncanny foresight, +1 CR", "beast": "Pteranodon · Mustang (reads the sky from the air)", "chainUp": "the Sky-Reader, Meyer Newcome", "chainDown": "claim-guards + camp bosses"}}, {"name": "Claim Boss Magnus Crale", "house": "Newcome", "tier": "Region Lord", "title": "Claim Boss — the Spine", "region": "V", "public": "Claim Boss of House Newcome in the high Spine, chasing the craters that fall in the cold mountains where few dare the rush. Hard, frostbitten, and rich.", "dm_prose": "Crale works the most dangerous rush country there is, where a fall in the peaks can mean a fortune or a frozen corpse. He fights Meridian for every yard of track to his claims and the Spine's older things for the claims themselves. Tell: he's never once been surprised by a strike.", "dm_tag": {"runAs": "Veteran (frontier)", "beast": "Styracosaurus · Longhorn", "chainUp": "the Sky-Reader, Meyer Newcome", "chainDown": "claim-guards + camp bosses"}}, {"name": "Claim Boss Cressida Ostrander", "house": "Newcome", "tier": "Region Lord", "title": "Claim Boss — the Greenreach", "region": "VI", "public": "Claim Boss of House Newcome in the Greenreach, racing to the craters that crash into the deep jungle. Fearless, feverish, and first.", "dm_prose": "Ostrander beats Sabine and the jungle both to the green-shrouded falls, and ships the living cargo out through Radiant's missions before anyone counts it. She knows exactly what the shells carry and chose the gems. Tell: she's gone before the smoke clears, every time.", "dm_tag": {"runAs": "Noble/Scout, Veteran", "beast": "Quetzalcoatlus · Mustang (a giant sky-ranger)", "chainUp": "the Sky-Reader, Meyer Newcome", "chainDown": "claim-guards + camp bosses"}}, {"name": "Chief Rush-Marshal Barnaby Stark", "house": "Newcome", "tier": "House Law", "title": "Chief of the Rush-Marshals", "region": "Frontier", "public": "The head of House Newcome's rush-marshals — the private claim-guards who keep order and protect the strikes. A blunt, fearless frontier lawman-for-hire.", "dm_prose": "Stark runs every claim-guard Newcome fields: he secures the falls, enforces crater-rights at gunpoint, and runs the quiet war with Sabine over crater-country ground. He suspects what the living cargo is for and has decided the pay is worth not knowing.", "dm_tag": {"runAs": "Veteran (captain), +2 CR", "beast": "Utahraptor · Sidewinder", "chainUp": "the Sky-Reader, Meyer Newcome", "chainDown": "camp guards"}}, {"name": "Sky-Reader Thea Vance", "house": "Newcome", "tier": "House Law", "title": "Sky-Reader — the Sunder Basin", "region": "I", "public": "A quiet, star-watching Newcome agent famous for knowing where to dig before anyone else.", "dm_prose": "One of Meyer's true sky-readers: she reads the coming falls off the night and sends the rush where the shells will land. She sees the whole manifest in the sky and keeps Newcome first; she is a thread straight to the keystone secret.", "dm_tag": {"runAs": "Scout/Diviner-flavored", "beast": "Pteranodon · Mustang", "chainUp": "Chief Stark & Meyer Newcome", "chainDown": "camp guards"}}, {"name": "Sky-Reader Josiah Vane", "house": "Newcome", "tier": "House Law", "title": "Sky-Reader — the Spine", "region": "V", "public": "A weathered sky-watcher who reads the cold mountain heavens for Crale.", "dm_prose": "Reads the high falls and has seen, through a far-glass, what rides down inside the shells; it has made him strange and quiet.", "dm_tag": {"runAs": "Scout", "beast": "Quetzalcoatlus · Mustang", "chainUp": "Chief Stark & Claim Boss Crale", "chainDown": "camp guards"}}, {"name": "Rush-Marshal Dell Hoyt", "house": "Newcome", "tier": "House Law", "title": "Claim-guard — the Sunder Basin", "region": "I", "public": "A fast, hard claim-guard who protects Newcome's basin strikes.", "dm_prose": "Guns down claim-jumpers and calls it law; the terror of the Scafield fields.", "dm_tag": {"runAs": "Veteran", "beast": "Deinonychus · Sidewinder", "chainUp": "Chief Stark & Claim Boss Roan", "chainDown": "camp guards"}}, {"name": "Rush-Marshal Prudie Okara", "house": "Newcome", "tier": "House Law", "title": "Claim-guard — the crater fields", "region": "I", "public": "A sharp claim-guard who works the crater fields' edge against Sabine.", "dm_prose": "Runs the dirty end of the water-and-range war with Dorn's riders; fences cut, wells watched, bodies found.", "dm_tag": {"runAs": "Veteran", "beast": "Achillobator · Sidewinder", "chainUp": "Chief Stark & Claim Boss Roan", "chainDown": "camp guards"}}, {"name": "Rush-Marshal \"Ox\" Benn", "house": "Newcome", "tier": "House Law", "title": "Claim-guard — Scafield", "region": "I", "public": "An enormous claim-guard who keeps the boomtown of Scafield from tearing itself apart.", "dm_prose": "Breaks up the nightly killings and takes Newcome's cut of the peace he keeps.", "dm_tag": {"runAs": "Thug (tough)", "beast": "Pachycephalosaurus · Ram", "chainUp": "Chief Stark & Claim Boss Roan", "chainDown": "camp guards"}}, {"name": "Rush-Marshal Greta Vane", "house": "Newcome", "tier": "House Law", "title": "Claim-guard — the Spine", "region": "V", "public": "A frostbitten claim-guard who holds Crale's high mountain claims.", "dm_prose": "Fights the cold, the jumpers, and whatever the Spine's deep places send against the strikes.", "dm_tag": {"runAs": "Veteran", "beast": "Ankylosaurus · Ironside", "chainUp": "Chief Stark & Claim Boss Crale", "chainDown": "camp guards"}}, {"name": "Rush-Marshal Teo Salas", "house": "Newcome", "tier": "House Law", "title": "Claim-guard — the Greenreach", "region": "VI", "public": "A jungle-hardened claim-guard who secures Ostrander's green-shrouded falls.", "dm_prose": "First to the fall and first to make sure no witness lingers near what came down.", "dm_tag": {"runAs": "Veteran", "beast": "Utahraptor · Sidewinder", "chainUp": "Chief Stark & Claim Boss Ostrander", "chainDown": "camp guards"}}, {"name": "Rufe Dillard", "house": "Newcome", "tier": "Local", "title": "Camp Boss — the Scafield claim", "region": "I", "public": "Camp boss of the Scafield strike — loud, greedy, keeps the diggers digging.", "dm_prose": "Runs the richest basin claim and has stopped asking what the guards haul off at night.", "dm_tag": {"runAs": "Commoner/Scout", "beast": "Triceratops · Longhorn", "chainUp": "Claim Boss Roan", "chainDown": "—"}}, {"name": "Nettie Soames", "house": "Newcome", "tier": "Local", "title": "Camp Boss — the Devouring-edge dig", "region": "I", "public": "Camp boss of a dig at the Sands of Devouring's edge — grim, lean, loses men to the salt.", "dm_prose": "Keeps a crew alive in the worst country Newcome works and resents everyone softer.", "dm_tag": {"runAs": "Commoner/Scout", "beast": "Edmontosaurus · Ironside"
